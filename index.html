const EXP_MULT = {beginner:0.65, intermediate:1.0, advanced:1.3};
// A population-average calibration only -- individual strength varies far
// more than sex alone predicts. Defaults to 1 (no change) for anyone who
// hasn't answered or skipped the question, including everyone who was
// already using the app before this field existed.
const SEX_MULT = {male:1.0, female:0.72, unspecified:1.0};
const EXP_CAP = {beginner:5, intermediate:6, advanced:7};
const EQUIP_ALLOWED = {full_gym:['barbell','dumbbell','machine','cable','bodyweight','bench'], home_dumbbells:['dumbbell','bodyweight','bench'], bodyweight:['bodyweight']};
const REP_RANGES = {
  strength: {compound:'4-6', isolation:'6-8'},
  hypertrophy: {compound:'6-10', isolation:'10-12'},
  endurance: {compound:'10-12', isolation:'12-15'},
};
const SET_COUNTS = {
  strength: {compound:5, isolation:3},
  hypertrophy: {compound:4, isolation:3},
  endurance: {compound:3, isolation:3},
};
const GOAL_TO_REPCAT = {strength:'strength', muscle_gain:'hypertrophy', recomp:'hypertrophy', fat_loss:'endurance', general:'endurance'};

function equipmentAllowed(e, tier){ const a = EQUIP_ALLOWED[tier]||[]; return e.equipment.every(eq=>a.includes(eq)); }
function jointOk(e, avoid){ if(!avoid || !avoid.length) return true; return !e.joints.some(j=>avoid.includes(j)); }

function buildPool(profile){
  return EX.filter(e=> equipmentAllowed(e, profile.equipment) && jointOk(e, profile.avoid||[]));
}

function pickExercise(pool, usedIds, muscle, need){
  let cands = pool.filter(e=> e.muscle===muscle && !usedIds.has(e.id) && e.compound===(need==='compound'));
  if(cands.length===0) cands = pool.filter(e=> e.muscle===muscle && !usedIds.has(e.id));
  if(cands.length===0) return null;
  // Pick randomly among equally-good candidates rather than always the first
  // in the array -- otherwise every user with the same answers (and every
  // retake with unchanged answers) gets an identical plan, exercise for
  // exercise, forever.
  return cands[Math.floor(Math.random()*cands.length)];
}

function materialize(e, profile){
  const repCat = dominantRepCat(profile.goals);
  const reps = REP_RANGES[repCat][e.compound?'compound':'isolation'];
  const sets = SET_COUNTS[repCat][e.compound?'compound':'isolation'];
  let weightDisplay = '—';
  if(e.unit !== 'bodyweight'){
    const mult = EXP_MULT[profile.experience] || 1;
    const sexMult = SEX_MULT[profile.sex] || 1;
    const bwRatio = e.bwScaled ? (profile.currentWeight / 183) : 1;
    let w = Math.round((e.seed * mult * sexMult * bwRatio) / 5) * 5;
    w = Math.max(5, w);
    weightDisplay = String(w);
  }
  return {id:e.id, name:e.name, tag:MUSCLE_LABEL[e.muscle]||e.muscle, sets, reps, weight:weightDisplay, unit:e.unit, muscles:e.desc};
}

function materializeCardio(e, profile){
  const dur = cardioProfileFor(profile.goals).duration;
  if(e.style === 'intervals'){
    return {id:e.id, name:e.name, tag:'Cardio', sets:6, reps:`${dur.intervals} · 30s on/30s off`, weight:'—', unit:'intervals', muscles:e.desc};
  }
  return {id:e.id, name:e.name, tag:'Cardio', sets:1, reps:dur.steady, weight:'—', unit:'steady-state', muscles:e.desc};
}

// Cardio dosage is scaled to the goal, not just bolted on uniformly: fat loss
// benefits from daily cardio, strength/muscle-gain goals get just enough to
// support cardiovascular health without competing with recovery for lifting.
function addCardioToPlan(days, profile, pool){
  const cardioPool = pool.filter(e=>e.muscle==='cardio');
  if(cardioPool.length===0) return;
  const steadyPool = cardioPool.filter(e=>e.style==='steady');
  const intervalPool = cardioPool.filter(e=>e.style==='intervals');

  days.forEach((day, idx)=>{
    let include, useIntervals;
    const cardioMode = cardioProfileFor(profile.goals).mode;
    if(cardioMode==='daily'){ include = true; useIntervals = (idx%2===1); }
    else if(cardioMode==='everyOther'){ include = (idx%2===1); useIntervals = false; }
    else { include = (idx === days.length-1); useIntervals = false; } // muscle_gain / strength only: once a week, steady only

    if(!include) return;
    const chosenPool = (useIntervals && intervalPool.length) ? intervalPool : (steadyPool.length ? steadyPool : cardioPool);
    const chosen = chosenPool[idx % chosenPool.length];
    day.exercises.push(materializeCardio(chosen, profile));
    if(!day.subtitle.includes('Cardio')) day.subtitle = day.subtitle ? day.subtitle + ' · Cardio' : 'Cardio';
  });
}

function buildDay(template, pool, dayNum, profile){
  const usedIds = new Set();
  const picked = [];
  template.targets.forEach(([muscle, need])=>{
    const ex = pickExercise(pool, usedIds, muscle, need);
    if(ex){ usedIds.add(ex.id); picked.push(ex); }
  });
  const cap = EXP_CAP[profile.experience] || 6;
  const finalPicks = picked.slice(0, cap);
  const uniqueTags = [...new Set(finalPicks.map(e=>MUSCLE_LABEL[e.muscle]||e.muscle))];
  return {
    day: dayNum, split: template.accent, title: template.title,
    subtitle: uniqueTags.join(' · '), tagline: template.tagline,
    exercises: finalPicks.map(e=>materialize(e, profile)),
  };
}

function generatePlan(profile){
  const templates = TEMPLATES[profile.days] || TEMPLATES[4];
  const pool = buildPool(profile);
  const days = templates.map((t,i)=>buildDay(t, pool, i+1, profile));
  addCardioToPlan(days, profile, pool);
  return {days, generatedAt: new Date().toISOString()};
}

/* ============================== DIET ============================== */
const ACTIVITY_MULT = {sedentary:12.5, light:14, moderate:15.5, very:17};
const GOAL_ADJ = {fat_loss:0.8, muscle_gain:1.1, recomp:0.9, strength:1.0, general:1.0};
const GOAL_LABEL = {fat_loss:'Lose Fat', muscle_gain:'Build Muscle', recomp:'Body Recomposition', strength:'Get Stronger', general:'General Fitness'};

// Someone can now pick more than one goal (e.g. "Lose Fat" + "Get Stronger"),
// which means several places that used to do a simple lookup on a single
// goal string need a real decision about what multiple, sometimes-competing
// goals should produce. Rep ranges and cardio dosage use a priority order
// (some goals have a more specific technical requirement than others);
// calorie target uses a plain average, since blending a deficit and a
// surplus into something closer to maintenance is the honest realistic
// answer for someone pursuing both at once, not a design compromise.
function dominantRepCat(goals){
  const cats = (goals||[]).map(g=>GOAL_TO_REPCAT[g]).filter(Boolean);
  if(cats.includes('strength')) return 'strength';
  if(cats.includes('hypertrophy')) return 'hypertrophy';
  if(cats.includes('endurance')) return 'endurance';
  return 'hypertrophy';
}
function blendedGoalAdj(goals){
  const adjs = (goals||[]).map(g=>GOAL_ADJ[g]).filter(v=>typeof v==='number');
  if(adjs.length===0) return 1;
  return adjs.reduce((a,b)=>a+b,0) / adjs.length;
}
function cardioProfileFor(goals){
  const g = goals||[];
  if(g.includes('fat_loss')) return {mode:'daily', duration:CARDIO_DURATION.fat_loss};
  if(g.includes('recomp')) return {mode:'everyOther', duration:CARDIO_DURATION.recomp};
  if(g.includes('general')) return {mode:'everyOther', duration:CARDIO_DURATION.general};
  return {mode:'weekly', duration:CARDIO_DURATION.general}; // muscle_gain / strength only
}
function goalsLabel(goals){
  return (goals&&goals.length) ? goals.map(g=>GOAL_LABEL[g]||g).join(' + ') : 'General Fitness';
}
const EQUIP_LABEL = {full_gym:'Full Gym', home_dumbbells:'Home (Dumbbells)', bodyweight:'Bodyweight Only'};
const SPLIT_LABEL = {3:'3-Day Full Body', 4:'4-Day Upper/Lower', 5:'5-Day Upper/Lower/Push/Pull/Legs', 6:'6-Day Push/Pull/Legs'};
const DIET_LABEL = {none:'No Restrictions', vegetarian:'Vegetarian', vegan:'Vegan', dairy_free:'Dairy-Free', gluten_free:'Gluten-Free'};
const EXPERIENCE_LABEL = {beginner:'Beginner', intermediate:'Intermediate', advanced:'Advanced'};
const ACTIVITY_LABEL = {sedentary:'Sedentary', light:'Lightly Active', moderate:'Moderately Active', very:'Very Active'};

function computeMacros(profile){
  const maintenance = profile.currentWeight * (ACTIVITY_MULT[profile.activity]||14.5);
  const targetCals = Math.round(maintenance * blendedGoalAdj(profile.goals));
  const proteinG = Math.round(profile.currentWeight * 1);
  const proteinCals = proteinG*4;
  // Carbs have a floor (roughly bodyweight-in-grams) so intake doesn't get
  // uncomfortably low. Previously fat was fixed at 0.35g/lb regardless, so
  // hitting the carb floor could silently push TOTAL calories above the
  // goal's intended target with no visibility -- for sedentary/light-activity
  // fat-loss users this happened basically every time, quietly shrinking
  // their deficit. Now fat flexes down toward a lower (still reasonable)
  // floor first, so the carb floor is absorbed without blowing past the
  // calorie target whenever there's room to do so.
  const carbFloorG = profile.currentWeight;
  const carbFloorCals = carbFloorG * 4;
  const minFatG = profile.currentWeight * 0.2;
  const minFatCals = minFatG * 9;
  const fatCals = Math.max(minFatCals, targetCals - proteinCals - carbFloorCals);
  const fatG = Math.round(fatCals/9);
  const carbCals = Math.max(carbFloorCals, targetCals - proteinCals - fatCals);
  const carbG = Math.round(carbCals/4);
  return {calories: Math.round(proteinCals+fatCals+carbCals), protein:proteinG, carbs:carbG, fat:fatG};
}

let authActionInFlight = false; // guards Sign In / Create Account against a fast double-click firing two requests

async function handleSignUp(email, password, confirmPw){
  if(authActionInFlight) return;
  hideError();
  if(!isValidEmail(email)){ showError('Enter a valid email address.'); return; }
  if(password.length < 6){ showError('Password must be at least 6 characters.'); return; }
  if(password !== confirmPw){ showError("Passwords don't match."); return; }
  authActionInFlight = true;
  const {data, error} = await sb.auth.signUp({
    email, password,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });
  authActionInFlight = false;
  if(error){ showError(error.message); return; }
  if(data.session){ sessionHandledOnce = true; currentUser = data.session.user; await loadProfileAndData(); maybeShowStreakToast(); return; }
  pendingEmail = email;
  APP_STATE = 'check-email';
  render();
}

async function handleSignIn(email, password){
  if(authActionInFlight) return;
  hideError();
  if(!isValidEmail(email)){ showError('Enter a valid email address.'); return; }
  authActionInFlight = true;
  const {data, error} = await sb.auth.signInWithPassword({email, password});
  authActionInFlight = false;
  if(error){
    if(error.message === 'Email not confirmed'){
      pendingEmail = email;
      APP_STATE = 'check-email';
      render();
      return;
    }
    showError(error.message);
    return;
  }
  sessionHandledOnce = true;
  currentUser = data.user;
  await loadProfileAndData();
  maybeShowStreakToast();
}

async function handleForgotPassword(email){
  hideError();
  if(!isValidEmail(email)){ showError('Enter a valid email address.'); return; }
  const {error} = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname,
  });
  if(error){ showError(error.message); return; }
  pendingEmail = email;
  APP_STATE = 'reset-email-sent';
  render();
}

// Shared by the "click the emailed link" recovery flow and the "change it
// from Account while already signed in" flow. Returns true on success so
// each caller can decide what to do next (navigate vs. just close a form).
async function handleUpdatePassword(newPw, confirmPw){
  hideError();
  if(!newPw || newPw.length < 6){ showError('Password must be at least 6 characters.'); return false; }
  if(newPw !== confirmPw){ showError("Passwords don't match."); return false; }
  const {error} = await sb.auth.updateUser({ password: newPw });
  if(error){ showError(error.message); return false; }
  hideError();
  showToast('✓ Password updated');
  return true;
}

}

/* ============================== DATA LOAD / SAVE ============================== */
async function loadProfileAndData(isRetry){
  APP_STATE = 'loading'; render();
  try{
    const {data: profRow, error: profErr} = await sb.from('user_profiles').select('*').eq('id', currentUser.id).maybeSingle();
    if(profErr) throw profErr;
    if(!profRow || !profRow.onboarded){
      profile = profRow || null;
      qAnswers = profRow ? {...profRow} : {};
      qIndex = 0;
      APP_STATE = 'questionnaire';
      render();
      return;
    }
    profile = profRow;
    applyPersonaTheme();
    const {data: dataRow, error: dataErr} = await sb.from('user_data').select('*').eq('id', currentUser.id).maybeSingle();
    if(dataErr) throw dataErr;
    plan = (dataRow && dataRow.plan) ? dataRow.plan : generatePlan(profileToGenInput(profile));
    const tracker = (dataRow && dataRow.tracker) ? dataRow.tracker : {state:{}, history:[], weightLog:[]};
    trackerState = tracker.state || {};
    trackerHistory = tracker.history || [];
    weightLog = tracker.weightLog || [];
    // Defaults here matter for backward compatibility: anyone whose data was
    // saved before streaks existed gets a clean starting streak rather than
    // undefined/NaN breaking the rollover math below.
    streakWeeks = tracker.streakWeeks || 0;
    streakFreezes = (typeof tracker.streakFreezes === 'number') ? tracker.streakFreezes : 2;
    lastFreezeRefillMonth = tracker.lastFreezeRefillMonth || null;
    recoveryLog = tracker.recoveryLog || [];
    exerciseHistory = tracker.exerciseHistory || {};
    dayCompletionLog = tracker.dayCompletionLog || {};
    if(migrateTrackerState()) silentSave();
    activeDay = getUpNextDay();
    handleWeekRollover();
    APP_STATE = 'dashboard';
    render();
  }catch(e){
    // A momentary blip here previously dumped an already-signed-in person
    // straight to a sign-in FORM, which is a strange place to land right
    // after successfully authenticating. One quiet automatic retry gives a
    // transient hiccup a chance to clear up on its own before bothering
    // the person at all.
    if(!isRetry){
      await sleep(1200);
      return loadProfileAndData(true);
    }
    showError('Could not load your data: ' + e.message);
    APP_STATE = 'signin';
    render();
  }
}

    const {error} = await sb.from('user_data').upsert({
      id: currentUser.id,
      plan,
      tracker: {state: trackerState, history: trackerHistory, weightLog, streakWeeks, streakFreezes, lastFreezeRefillMonth, recoveryLog, exerciseHistory, dayCompletionLog},
      updated_at: new Date().toISOString(),
    });
    if(error) throw error;
  };
  const resultPromise = writeLock.then(run, run);
  writeLock = resultPromise.then(()=>{}, ()=>{});
  return resultPromise;
}

async function writeWithRetry(attempts=3){
  let lastErr;
  for(let i=0;i<attempts;i++){
    try{ return await saveUserData(); }
    catch(e){ lastErr=e; await sleep(300*(i+1)); }
  }
  throw lastErr;
}

async function silentSave(){
  try{ await writeWithRetry(3); return true; }
  catch(e){ console.warn('Background save failed', e); return false; }
}

function renderSaveStatus(){
  const el = document.getElementById('saveStatusPill');
  const textEl = document.getElementById('saveStatusText');
  if(!el || !textEl) return;
  if(saveStatus==='saving'){ el.className='save-pill saving'; textEl.textContent='SAVING'; }
  else if(saveStatus==='saved' && lastSavedAt){ el.className='save-pill ok'; textEl.textContent='SAVED'; }
  else if(saveStatus==='error'){ el.className='save-pill err'; textEl.textContent='ERROR'; }
  else{ el.className='save-pill'; textEl.textContent='—'; }
}

async function saveAll(){
  saveStatus='saving'; renderSaveStatus();
  try{
    await writeWithRetry(3);
    saveStatus='saved'; lastSavedAt=new Date(); renderSaveStatus();
    return true;
  }catch(e){
    saveStatus='error'; renderSaveStatus();
    // A failed save used to be visible only as a few small words of status
    // text elsewhere on the screen -- easy to miss entirely, especially since
    // the UI shows your change as already "done" the moment you click. Every
    // save failure now also raises the same prominent banner used for every
    // other error in the app, regardless of which action triggered it.
    showError("Couldn't save your last change — check your connection and try again.");
    return false;
  }
}

/* ============================== ACCOUNT DELETION ============================== */
// This removes the user's own data (profile, plan, tracker history) via RLS —
// safe to do with just the public key. It does NOT remove the underlying
// Supabase Auth login credential itself; that requires a service-role action,
// which is a separate, optional server-side step (see setup notes).
async function confirmDeleteData(){
  try{
    // Supabase's delete calls report failure via a returned {error}, not
    // necessarily by throwing -- checking only for a thrown exception (as
    // this used to do) let a rejected/failed delete look identical to a
    // successful one, with nothing shown to the user and no way to know
    // your data wasn't actually removed. Both steps are checked explicitly
    // now, and the second delete is not attempted if the first failed, so a
    // partial failure can't happen silently.
    // Deleting the profile FIRST (not the workout data) means that if the
    // second call fails, the account is left looking brand-new (no profile
    // = treated as a new signup next time) rather than looking fully
    // onboarded with its history quietly missing, which is a much more
    // confusing state to land in by accident.
    const {error: profErr} = await sb.from('user_profiles').delete().eq('id', currentUser.id);
    if(profErr) throw profErr;
    const {error: dataErr} = await sb.from('user_data').delete().eq('id', currentUser.id);
    if(dataErr) throw dataErr;
    await sb.auth.signOut();
    currentUser = null; profile = null; plan = null;
    trackerState = {}; trackerHistory = []; weightLog = [];
    APP_STATE = 'signin';
    render();
  }catch(e){
    showError('Could not delete your data: ' + e.message);
  }
}

// Calls the delete-account Edge Function, which is the only thing that can
// safely remove the actual login credential (that requires a service-role
// key, which must never exist in this file or any browser). If the function
// hasn't been deployed yet, this fails clearly rather than pretending to
// have deleted an account it couldn't reach.
async function confirmPermanentDelete(){
  try{
    const {data, error} = await sb.functions.invoke('delete-account', {});
    if(error) throw new Error(await describeFunctionError(error));
    if(!data || !data.success) throw new Error((data && data.error) || 'Unknown error from delete-account function');
    await sb.auth.signOut();
    currentUser = null; profile = null; plan = null;
    trackerState = {}; trackerHistory = []; weightLog = [];
    APP_STATE = 'signin';
    render();
    showToast('Your account has been permanently deleted.');
  }catch(e){
    showError("Couldn't permanently delete your account: " + e.message + '. Your data may still be intact -- try again, or use "Erase My Data" in the meantime.');
  }
}

// Calls the ai-coach Edge Function for one specific exercise, using the same
// completion history the progression rules already read. Deliberately
// on-demand (a tap, not automatic) so this costs real API money only when
// someone actually wants a note, not on every render or every set checked.
async function getCoachingNote(exId){
  const dayObj = plan.days.find(d=>d.day===activeDay);
  const ex = dayObj && dayObj.exercises.find(e=>e.id===exId);
  if(!ex) return;
  coachingNoteExId = exId; coachingNoteLoading = true; coachingNoteText = null; coachingNoteError = null;
  renderDashboard();
  try{
    const {data, error} = await sb.functions.invoke('ai-coach', {
      body: { exerciseName: ex.name, currentWeight: ex.weight, unit: ex.unit, recentWeeks: exerciseHistory[exId] || [] }
    });
    if(error) throw new Error(await describeFunctionError(error));
    if(!data || !data.note) throw new Error((data && data.error) || 'No note returned');
    coachingNoteText = data.note;
  }catch(e){
    coachingNoteError = "AI coaching isn't available right now" + (e && e.message ? ` (${e.message})` : '') + '.';
  }
  coachingNoteLoading = false;
  renderDashboard();
}

/* ============================== QUESTIONNAIRE FLOW ============================== */
function qCanAdvance(){
  const q = QUESTIONS[qIndex];
  if(q.type==='single') return qAnswers[q.key] !== undefined && qAnswers[q.key] !== null;
  if(q.type==='multi') return (qAnswers[q.key]||[]).length >= (q.minSelect||0);
  if(q.type==='numbers'){
    return q.fields.every(f=>{
      const v = qAnswers[f.key];
      return v !== undefined && v !== '' && !isNaN(v) && v >= f.min && v <= f.max;
    });
  }
  return true;
}

// Lets someone back out of onboarding regardless of how they got there (the
// tap-through form or the chat) or who they are. The two destinations are
// genuinely different, not just cosmetically: an existing user retaking
// their plan has a real dashboard to return to, with nothing lost since
// nothing mid-flow was ever saved; a brand-new user has no dashboard yet at
// all, so signing out is the only sensible exit -- and it's not
// destructive, their account still exists and they'll land right back on
// this same questionnaire next time they sign in.
function exitOnboarding(){
  if(profile && profile.onboarded){
    qIndex = 0; qAnswers = {};
    chatMessages = []; chatExtracted = null; chatReadyToBuild = false;
    APP_STATE = 'dashboard';
    render();
  } else {
    handleSignOut();
  }
}

function renderQuestionnaire(){
  const q = QUESTIONS[qIndex];
  const segs = QUESTIONS.map((_,i)=>`<div class="seg ${i<=qIndex?'done':''}"></div>`).join('');
  let body = '';
  if(q.type==='single'){
    body = `<div class="q-options">${q.options.map(o=>`
      <div class="q-option ${qAnswers[q.key]===o.value?'selected':''}" data-val="${o.value}">${o.label}</div>
    `).join('')}</div>`;
  } else if(q.type==='multi'){
    if(!Array.isArray(qAnswers[q.key])) qAnswers[q.key] = [];
    body = `<div class="q-chips">${q.options.map(o=>`
      <div class="q-chip ${qAnswers[q.key].includes(o.value)?'selected':''}" data-val="${o.value}">${o.label}</div>
    `).join('')}</div>`;
  } else if(q.type==='numbers'){
    body = `<div class="q-input-row">${q.fields.map(f=>`
      <label>${f.label}</label>
      <input type="text" inputmode="decimal" data-key="${f.key}" value="${qAnswers[f.key]!==undefined?qAnswers[f.key]:''}" placeholder="e.g. ${f.key==='timeframeWeeks'?'12':'180'}">
    `).join('')}</div>`;
  } else if(q.type==='text'){
    body = `<div class="q-input-row"><input type="text" data-key="${q.key}" value="${escapeAttr(qAnswers[q.key]||'')}" placeholder="${escapeAttr(q.placeholder||'')}"></div>`;
  }

  root().innerHTML = `
    <div class="title-block" style="margin-top:24px;">
      <button class="q-exit-btn" id="qExitBtn" title="${profile && profile.onboarded ? 'Back to dashboard' : 'Sign out'}">✕</button>
      <h1>GRIND<br>MODE</h1><p>Let's build your plan</p>
    </div>
    <div class="step-progress">${segs}</div>
    <div class="q-card">
      <div class="q-eyebrow">Step ${qIndex+1} of ${QUESTIONS.length}</div>
      <div class="q-title">${q.title}</div>
      ${body}
      <div class="q-nav">
        ${qIndex>0 ? `<button id="qBack">Back</button>` : `<button id="qBack" disabled>Back</button>`}
        <button id="qNext" class="primary" ${qCanAdvance()?'':'disabled'}>${qIndex===QUESTIONS.length-1?'Build My Plan':'Next'}</button>
      </div>
    </div>
    ${qIndex===0 ? `<div class="q-chat-entry">Multiple goals, or just don't feel like tapping through steps? <a id="openChatIntake">Tell us about yourself instead</a></div>` : ''}
  `;

  if(qIndex===0){
    document.getElementById('openChatIntake').onclick = startChatIntake;
  }
  document.getElementById('qExitBtn').onclick = exitOnboarding;

  if(q.type==='single'){
    root().querySelectorAll('.q-option').forEach(el=>{
      el.onclick = ()=>{
        const raw = el.dataset.val;
        qAnswers[q.key] = isNaN(raw) ? raw : Number(raw);
        renderQuestionnaire();
      };
    });
  } else if(q.type==='multi'){
    root().querySelectorAll('.q-chip').forEach(el=>{
      el.onclick = ()=>{
        const v = el.dataset.val;
        const idx = qAnswers[q.key].indexOf(v);
        if(idx>=0) qAnswers[q.key].splice(idx,1); else qAnswers[q.key].push(v);
        renderQuestionnaire();
      };
    });
  } else if(q.type==='numbers'){
    root().querySelectorAll('input[data-key]').forEach(el=>{
      el.oninput = ()=>{
        qAnswers[el.dataset.key] = el.value === '' ? '' : parseFloat(el.value);
        document.getElementById('qNext').disabled = !qCanAdvance();
      };
    });
  } else if(q.type==='text'){
    const el = root().querySelector('input[data-key]');
    if(el) el.oninput = ()=>{ qAnswers[el.dataset.key] = el.value; };
  }

  document.getElementById('qBack').onclick = ()=>{ if(qIndex>0){ qIndex--; renderQuestionnaire(); } };
  document.getElementById('qNext').onclick = async ()=>{
    if(!qCanAdvance()) return;
    if(qIndex < QUESTIONS.length-1){ qIndex++; renderQuestionnaire(); return; }
    await finalizeOnboarding();
  };
}

async function sendChatMessage(text){
  chatMessages.push({role:'user', content:text});
  chatSending = true; chatError = null;
  renderChatIntake();
  try{
    // existingProfile stays null here -- onboarding means there's nothing
    // yet to merge a partial update into, which is also how the function
    // knows to require every field before treating a proposal as real.
    const {data, error} = await sb.functions.invoke('plan-chat', { body: { messages: chatMessages, existingProfile: null } });
    if(error) throw new Error(await describeFunctionError(error));
    if(!data || !data.reply) throw new Error((data && data.error) || 'No reply from the assistant');
    chatMessages.push({role:'assistant', content:data.reply});
    if(data.planProposal) chatPlanProposal = data.planProposal;
  }catch(e){
    // The user's message stays visible either way -- only the failed reply
    // is missing, so retrying just means sending the next message normally
    // rather than needing to redo anything already said.
    chatError = "Couldn't reach the AI assistant" + (e && e.message ? ` (${e.message})` : '') + '. You can try again, or switch to the form.';
  }
  chatSending = false;
  renderChatIntake();
}

async function buildPlanFromChat(){
  const drills = chatPlanProposal.pendingDrills;
  qAnswers = {
    goals: chatPlanProposal.goals||[], experience: chatPlanProposal.experience, sex: chatPlanProposal.sex,
    days: chatPlanProposal.days, equipment: chatPlanProposal.equipment, activity: chatPlanProposal.activity,
    diet: chatPlanProposal.diet, currentWeight: chatPlanProposal.currentWeight, goalWeight: chatPlanProposal.goalWeight,
    timeframeWeeks: chatPlanProposal.timeframeWeeks, avoid: chatPlanProposal.avoid||[],
    sport: chatPlanProposal.sport || '',
  };
  await finalizeOnboarding();
  // finalizeOnboarding sets `plan` only once the build+save actually
  // succeeds -- if it failed, plan stays whatever it was before (null for
  // a brand-new signup), which is exactly what tells us not to touch
  // exercises on a plan that was never actually created.
  if(plan && drills && drills.length > 0){
    drills.forEach(d => {
      const dayObj = plan.days[d.dayIndex - 1];
      if(!dayObj) return; // an out-of-range index just gets skipped, not crashed on
      dayObj.exercises.push({
        id: 'coach_'+Date.now()+'_'+Math.random().toString(36).slice(2),
        name: d.name, tag: MUSCLE_LABEL[d.muscle] || 'Cardio', sets: d.sets, reps: d.reps,
        weight: d.weight ? String(d.weight) : '—', unit: d.weight ? 'lbs' : 'bodyweight',
        muscles: d.targets,
      });
    });
    renderDashboard();
    await saveAll(); // a second save -- finalizeOnboarding's own save already ran before these existed
  }
}

// Context handed to the coach alongside the conversation. Matches the same
// field names the propose_plan tool itself uses (so the model can propose
// changes against a shape it already understands), plus progress data
// beyond the static profile -- without this, "how am I doing" can only ever
// get a generic answer, since the model would have no actual progress to
// reference.
// Summarizes recent recovery check-ins (fresh/okay/wiped) into one short
// line rather than handing over the whole log -- enough signal for the
// coach to notice a pattern ("wiped 3 of your last 4 check-ins") without
// needing to reason over a growing list itself.
function recentRecoverySummary(){
  const recent = recoveryLog.slice(-7);
  if(recent.length === 0) return 'no recent check-ins';
  const wiped = recent.filter(r=>r.level==='wiped').length;
  const fresh = recent.filter(r=>r.level==='fresh').length;
  const okay = recent.length - wiped - fresh;
  return `last ${recent.length} check-ins: ${fresh} fresh, ${okay} okay, ${wiped} wiped`;
}

function coachContext(){
  const lastWeek = trackerHistory.length ? trackerHistory[trackerHistory.length-1] : null;
  return {
    goals: profile.goals||[], experience: profile.experience, sex: profile.sex||'unspecified',
    days: profile.days_per_week, equipment: profile.equipment, activity: profile.activity,
    diet: profile.diet, currentWeight: profile.current_weight, goalWeight: profile.goal_weight,
    timeframeWeeks: profile.timeframe_weeks, avoid: profile.avoid||[], sport: profile.sport || null,
    streakWeeks, lastWeekCompletion: lastWeek ? `${lastWeek.done}/${lastWeek.total} workouts` : 'no completed weeks yet',
    recentRecovery: recentRecoverySummary(),
    // So the coach can correctly say "I'll add that to day 3" and actually
    // mean the right day, rather than guessing a number with no idea what
    // it corresponds to.
    currentPlanDays: plan.days.map(d => ({day: d.day, title: d.title, split: d.split, exerciseCount: d.exercises.length})),
  };
}

async function sendCoachMessage(text){
  coachMessages.push({role:'user', content:text});
  coachSending = true; coachError = null;
  renderCoach();
  saveCoachMessage('user', text); // fire-and-forget, does not block the UI
  try{
    // existingProfile carries the person's real, current data -- this is
    // what lets the SAME function that ran onboarding now give genuinely
    // personalized answers ("you've hit every set this week") instead of
    // generic ones, and lets it propose a PARTIAL update instead of
    // requiring the whole profile to be restated.
    const {data, error} = await sb.functions.invoke('plan-chat', { body: { messages: coachMessages, existingProfile: coachContext() } });
    if(error) throw new Error(await describeFunctionError(error));
    if(!data || !data.reply) throw new Error((data && data.error) || 'No reply from the coach');
    coachMessages.push({role:'assistant', content:data.reply});
    saveCoachMessage('assistant', data.reply);
    if(data.planProposal) coachPlanProposal = data.planProposal;
    if(data.exercisesProposal) coachExercisesProposal = data.exercisesProposal;
  }catch(e){
    coachError = "Couldn't reach your coach" + (e && e.message ? ` (${e.message})` : '') + '. You can try again.';
  }
  coachSending = false;
  renderCoach();
}

function applyCoachPlanProposal(){
  // Merges whatever the proposal actually changed into the person's current
  // answers -- fields it left out keep their existing value -- then reuses
  // the exact same, already-tested save/generate pipeline onboarding uses,
  // rather than a second way of writing a plan to the database.
  const p = coachPlanProposal;
  qAnswers = {
    goals: p.goals !== undefined ? p.goals : profile.goals,
    experience: p.experience !== undefined ? p.experience : profile.experience,
    sex: p.sex !== undefined ? p.sex : profile.sex,
    days: p.days !== undefined ? p.days : profile.days_per_week,
    equipment: p.equipment !== undefined ? p.equipment : profile.equipment,
    activity: p.activity !== undefined ? p.activity : profile.activity,
    diet: p.diet !== undefined ? p.diet : profile.diet,
    currentWeight: p.currentWeight !== undefined ? p.currentWeight : profile.current_weight,
    goalWeight: p.goalWeight !== undefined ? p.goalWeight : profile.goal_weight,
    timeframeWeeks: p.timeframeWeeks !== undefined ? p.timeframeWeeks : profile.timeframe_weeks,
    avoid: p.avoid !== undefined ? p.avoid : (profile.avoid||[]),
    sport: p.sport !== undefined ? p.sport : (profile.sport||''),
  };
  finalizeOnboarding();
}

// Same shape and same save/rollback pattern as the manual "Add Exercise"
// form (handleSaveAddEx) -- this is genuinely the same action, just
// initiated by the coach instead of someone filling out the form
// themselves, so it reuses the exact mechanism rather than a second,
// parallel way of adding exercises to a day.
async function applyCoachExercisesProposal(){
  const dayObj = plan.days.find(d => d.day === coachExercisesProposal.day);
  if(!dayObj){
    coachError = "Couldn't find that day in your plan anymore.";
    coachExercisesProposal = null;
    renderCoach();
    return;
  }
  const newExercises = coachExercisesProposal.exercises.map((ex, i) => ({
    id: 'coach_'+Date.now()+'_'+i,
    name: ex.name, tag: MUSCLE_LABEL[ex.muscle] || 'Cardio', sets: ex.sets, reps: ex.reps,
    weight: ex.weight ? String(ex.weight) : '—', unit: ex.weight ? 'lbs' : 'bodyweight',
    muscles: ex.targets,
  }));
  dayObj.exercises.push(...newExercises);
  coachExercisesProposal = null;
  renderCoach();
  const ok = await saveAll();
  if(!ok){
    // Wasn't actually saved -- don't leave the plan showing exercises that
    // don't exist anywhere but this browser tab.
    const addedIds = new Set(newExercises.map(e=>e.id));
    dayObj.exercises = dayObj.exercises.filter(e=>!addedIds.has(e.id));
    coachError = "Couldn't save those exercises to your plan -- try again.";
  }
  renderCoach();
}

async function finalizeOnboarding(){
  const btn = document.getElementById('qNext');
  if(btn){ btn.disabled = true; btn.textContent = 'Building…'; }
  hideError();
  // Retaking the questionnaire (adjusting goals/equipment) is not the same
  // event as a brand-new signup -- someone with a 10-week streak shouldn't
  // lose it just because they updated their equipment. Only a genuinely new
  // account (no prior onboarded profile) starts streak/freeze state fresh.
  const isRetake = !!(profile && profile.onboarded);
  const genInput = {
    goals: qAnswers.goals||[], experience: qAnswers.experience, days: qAnswers.days,
    equipment: qAnswers.equipment, currentWeight: qAnswers.currentWeight, avoid: qAnswers.avoid||[],
    sex: qAnswers.sex || 'unspecified',
  };
  const newPlan = generatePlan(genInput);
  const profileRow = {
    id: currentUser.id, email: currentUser.email,
    goals: qAnswers.goals||[], experience: qAnswers.experience, days_per_week: qAnswers.days,
    equipment: qAnswers.equipment, activity: qAnswers.activity, diet: qAnswers.diet,
    current_weight: qAnswers.currentWeight, goal_weight: qAnswers.goalWeight,
    timeframe_weeks: qAnswers.timeframeWeeks, avoid: qAnswers.avoid||[], onboarded: true,
    sex: qAnswers.sex || 'unspecified',
    sport: (qAnswers.sport||'').trim() || null,
    created_at: new Date().toISOString(),
  };
  try{
    const {data, error} = await sb.from('user_profiles').upsert(profileRow).select().single();
    if(error) throw error;
    profile = data;
    applyPersonaTheme();
    plan = newPlan;
    trackerState = {}; trackerHistory = [];
    weightLog = [{date: todayISO(), weight: qAnswers.currentWeight}];
    if(!isRetake){ streakWeeks = 0; streakFreezes = 2; lastFreezeRefillMonth = new Date().toISOString().slice(0,7); }
    const {error: dataErr} = await sb.from('user_data').upsert({id: currentUser.id, plan, tracker:{state:trackerState, history:trackerHistory, weightLog, streakWeeks, streakFreezes, lastFreezeRefillMonth, recoveryLog:[], exerciseHistory:{}, dayCompletionLog}, updated_at:new Date().toISOString()});
    if(dataErr) throw dataErr;
    activeDay = 1;
    APP_STATE = 'dashboard';
    render();
  }catch(e){
    showError('Could not save your plan: ' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Build My Plan'; }
  }
}

function startRetake(){
  qAnswers = {
    // Spreading into new arrays here matters: without it, qAnswers.goals and
    // profile.goals would be the SAME array object, so every tap while
    // retaking (even before "Build My Plan") would mutate the real, already-
    // saved profile in place -- meaning abandoning a retake via the exit
    // button wouldn't actually abandon anything, changes already made would
    // silently stick despite never being saved.
    goals:[...(profile.goals||[])], experience:profile.experience, days:profile.days_per_week, equipment:profile.equipment,
    activity:profile.activity, diet:profile.diet, currentWeight:profile.current_weight, goalWeight:profile.goal_weight,
    timeframeWeeks:profile.timeframe_weeks, avoid:[...(profile.avoid||[])], sex:profile.sex||'unspecified',
    sport: profile.sport || '',
  };
  qIndex = 0;
  APP_STATE = 'questionnaire';
  render();
}

/* ============================== TRACKER LOGIC (per-user) ============================== */
// Progress must be keyed by (day + exercise), not exercise alone — the same
// exercise can legitimately appear on more than one day (e.g. a 6-day PPL
// split repeats "Push Day" twice), and a bare exercise-id key would make
// checking a set on one day also mark it done on every other day sharing
// that exercise. '::' can't appear in a real exercise id, so it's a safe
// separator.
function trackerKey(day, exId){ return `${day}::${exId}`; }

// One-time migration for accounts saved before day-scoping existed: a bare
// exercise-id key that maps to exactly one day in the current plan is
// unambiguous and gets moved forward; a key matching more than one day is
// exactly the cross-day bug itself, so it's dropped rather than guessed at.
function migrateTrackerState(){
  if(!plan || !Array.isArray(plan.days)) return false;
  const idToDays = {};
  plan.days.forEach(d=> d.exercises.forEach(ex=>{
    (idToDays[ex.id] = idToDays[ex.id] || []).push(d.day);
  }));
  let changed = false;
  Object.keys(trackerState).forEach(key=>{
    if(key === '__meta' || key.includes('::')) return;
    const days = idToDays[key];
    if(days && days.length === 1){
      const newKey = trackerKey(days[0], key);
      if(!trackerState[newKey]) trackerState[newKey] = trackerState[key];
    }
    delete trackerState[key];
    changed = true;
  });
  return changed;
}

function isExerciseDone(ex, s){
  const checks = (s && s.setsChecked) || [];
  if(checks.length !== ex.sets) return false;
  return checks.every(Boolean);
}
function dayProgress(dayNum){
  const d = plan.days.find(x=>x.day===dayNum);
  const total = d.exercises.length;
  const done = d.exercises.filter(ex=>isExerciseDone(ex, trackerState[trackerKey(dayNum, ex.id)])).length;
  return {done, total, pct: total?done/total:0};
}
function getUpNextDay(){
  for(const d of plan.days){ if(d.exercises.length>0 && dayProgress(d.day).pct < 1) return d.day; }
  // Everything real is either complete or there's nothing left incomplete --
  // still prefer a day that actually HAS exercises over blindly defaulting
  // to day one, in case day one itself is the empty one.
  const firstNonEmpty = plan.days.find(d=>d.exercises.length>0);
  return firstNonEmpty ? firstNonEmpty.day : plan.days[0].day;
}
function getWeekId(d){
  const day = d.getDay();
  const diffToMonday = (day+6)%7;
  const monday = new Date(d); monday.setDate(d.getDate()-diffToMonday);
  return `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;
}
function getWeekLabel(weekId){
  const monday = new Date(weekId+'T00:00:00');
  const saturday = new Date(monday); saturday.setDate(monday.getDate()+5);
  return `${monday.toLocaleDateString(undefined,{month:'short',day:'numeric'})}–${saturday.toLocaleDateString(undefined,{day:'numeric'})}`;
}
function computeWeekStats(){
  let totalDone=0, totalEx=0;
  plan.days.forEach(d=>{ const {done,total}=dayProgress(d.day); totalDone+=done; totalEx+=total; });
  return {done:totalDone, total:totalEx};
}

/* ============================== ADAPTIVE PROGRESSION (rule-based) ==============================
   Runs once per week rollover, using the week that just ended. No AI here --
   two plain rules against data the app already has:
     - fully completed both of the last 2 weeks on an exercise -> nudge weight up
     - missed sets both of the last 2 weeks on an exercise -> back off slightly
   One entry per exercise per week (not per session) to match the app's
   existing weekly rhythm rather than inventing a new one. */
// Two or more "wiped" check-ins out of the last 7 is treated as a real
// pattern worth acting on, not just one rough day -- a single bad day
// shouldn't change anything, the same way one missed set doesn't reset a
// streak.
function recoveryIsPoor(){
  const recent = recoveryLog.slice(-7);
  return recent.filter(r=>r.level==='wiped').length >= 2;
}

function recordAndApplyProgression(){
  const seenIds = new Set();
  const messages = [];
  const recoveryMessages = [];
  const poorRecovery = recoveryIsPoor();

  plan.days.forEach(d=>{
    d.exercises.forEach(ex=>{
      if(seenIds.has(ex.id)) return;
      seenIds.add(ex.id);

      // An exercise can appear on more than one day (e.g. bench press on two
      // push days) -- "fully completed this week" means every occurrence was.
      const occurrenceDays = plan.days.filter(dd=> dd.exercises.some(e=>e.id===ex.id)).map(dd=>dd.day);
      const allDone = occurrenceDays.every(day=> isExerciseDone(ex, trackerState[trackerKey(day, ex.id)]));
      if(!exerciseHistory[ex.id]) exerciseHistory[ex.id] = [];
      exerciseHistory[ex.id].push(allDone);
      if(exerciseHistory[ex.id].length>4) exerciseHistory[ex.id] = exerciseHistory[ex.id].slice(-4);

      if(ex.unit==='bodyweight') return; // nothing numeric to adjust
      const hist = exerciseHistory[ex.id];
      if(hist.length<2) return;
      const lastTwo = hist.slice(-2);
      const w = parseFloat(ex.weight);
      if(isNaN(w)) return;
      let newW = null;
      let recoveryDriven = false;
      if(lastTwo[0]===true && lastTwo[1]===true){
        if(poorRecovery){
          // Completion alone says "increase," but completing every set
          // while consistently wiped is exactly the pattern that leads to
          // overtraining, not proof the weight was too light -- ease off
          // instead of pushing further, and say so plainly rather than
          // quietly overriding what completion alone would have done.
          newW = Math.max(5, w-5);
          recoveryDriven = true;
        } else {
          newW = w+5;
        }
      }
      else if(lastTwo[0]===false && lastTwo[1]===false) newW = Math.max(5, w-5);
      if(newW!==null && newW!==w){
        const msg = `${ex.name} → ${newW} lbs`;
        if(recoveryDriven) recoveryMessages.push(msg); else messages.push(msg);
        plan.days.forEach(dd=> dd.exercises.forEach(e=>{ if(e.id===ex.id) e.weight = String(newW); }));
      }
    });
  });

  if(messages.length>0){
    const verb = messages.length===1 ? 'Adjusted' : `Adjusted ${messages.length} exercises`;
    pendingProgressionToast = `${verb} based on last week: ${messages.slice(0,3).join(', ')}${messages.length>3?'…':''}`;
  }
  if(recoveryMessages.length>0){
    const verb = recoveryMessages.length===1 ? 'eased' : `eased ${recoveryMessages.length} exercises`;
    pendingRecoveryToast = `😴 Noticed a real recovery pattern this week — ${verb} down instead of increasing, so you can bounce back: ${recoveryMessages.slice(0,3).join(', ')}${recoveryMessages.length>3?'…':''}`;
  }
}

function handleWeekRollover(){
  // Freezes refill once per calendar month, independent of whether a
  // tracker week has actually rolled over yet (someone could open the app
  // mid-month with no week boundary crossed and still be due a refill).
  const thisMonth = new Date().toISOString().slice(0,7);
  if(lastFreezeRefillMonth !== thisMonth){
    if(lastFreezeRefillMonth !== null) streakFreezes = Math.min(2, streakFreezes + 1);
    lastFreezeRefillMonth = thisMonth;
  }

  const todayWeekId = getWeekId(new Date());
  if(!trackerState.__meta){
    trackerState.__meta = {weekId: todayWeekId};
    silentSave();
  } else if(trackerState.__meta.weekId !== todayWeekId){
    const oldWeekId = trackerState.__meta.weekId;
    const stats = computeWeekStats();
    // "Good" mirrors the bar the app already celebrates with WEEK CONQUERED --
    // one consistent definition of a complete week, rather than a second,
    // different threshold living only in the streak math.
    const wasGoodWeek = stats.total>0 && stats.done===stats.total;
    let frozen = false;
    if(stats.total>0){
      if(wasGoodWeek){
        streakWeeks += 1;
      } else if(streakFreezes>0){
        streakFreezes -= 1;
        frozen = true;
        pendingStreakToast = `That week was tough — used a freeze to keep your ${streakWeeks}-week streak alive.`;
      } else {
        if(streakWeeks>0) pendingStreakToast = 'Streak reset — every week is a fresh start.';
        streakWeeks = 0;
      }
      trackerHistory.push({weekId: oldWeekId, label:getWeekLabel(oldWeekId), done:stats.done, total:stats.total, frozen});
      if(trackerHistory.length>26) trackerHistory = trackerHistory.slice(trackerHistory.length-26);
      recordAndApplyProgression();
    }
    trackerState = {__meta:{weekId: todayWeekId}};
    silentSave();
  }
}

function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function formatShortDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }

// Renders the weight-trend line chart as an inline SVG string. Needs at
// least 2 points to draw a meaningful line -- with fewer, a real chart
// would just be a single dot or a flat line, which tells you nothing, so a
// plain-language empty state is shown instead of a technically-valid but
// useless chart.
function renderWeightTrendSvg(entries, goalWeight){
  if(!entries || entries.length < 2){
    return `<div class="chart-empty">Log a few more entries to see your trend.</div>`;
  }
  const weights = entries.map(e=>e.weight);
  const allValues = [...weights, goalWeight];
  const minV = Math.min(...allValues), maxV = Math.max(...allValues);
  const span = (maxV - minV) || 1;
  const pad = span * 0.18;
  const yMin = minV - pad, yMax = maxV + pad;
  const W = 320, H = 100;
  const toY = v => H - ((v - yMin) / (yMax - yMin)) * H;
  const toX = i => entries.length===1 ? W/2 : (i / (entries.length - 1)) * W;
  const points = entries.map((e,i)=>`${toX(i).toFixed(1)},${toY(e.weight).toFixed(1)}`).join(' ');
  const goalY = toY(goalWeight);
  const lastX = toX(entries.length-1), lastY = toY(entries[entries.length-1].weight);
  const firstLabel = formatShortDate(entries[0].date), lastLabel = formatShortDate(entries[entries.length-1].date);
  return `
    <svg viewBox="0 0 ${W} ${H+30}" style="width:100%; overflow:visible;">
      <line x1="0" y1="${goalY.toFixed(1)}" x2="${W}" y2="${goalY.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="0" y="${Math.max(10,goalY-6).toFixed(1)}" font-size="9" fill="var(--muted)" font-family="JetBrains Mono, monospace">GOAL · ${goalWeight} LBS</text>
      <polyline points="${points}" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="4.5" fill="var(--gold)"/>
      <text x="0" y="${H+22}" font-size="9" fill="var(--muted)" font-family="JetBrains Mono, monospace">${escapeHtml(firstLabel).toUpperCase()}</text>
      <text x="${W}" y="${H+22}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="JetBrains Mono, monospace">${escapeHtml(lastLabel).toUpperCase()}</text>
    </svg>`;
}

// Renders the weekly-completion bar chart. Height AND color intensity both
// encode completion percentage -- full gold at 100%, fading toward a dim
// outline near 0% -- so a strong or weak stretch reads at a glance from the
// overall color pattern, not just from comparing individual bar heights.
function weekBarColor(pct){
  if(pct >= 0.9) return 'var(--gold)';
  if(pct >= 0.65) return 'var(--heat-3)';
  if(pct >= 0.35) return 'var(--heat-2)';
  if(pct > 0) return 'var(--heat-1)';
  return 'var(--heat-0)';
}
// Real calendar heatmap -- 13 weeks x 7 days, oldest at top-left, today at
// bottom-right, matching the conventional GitHub-style layout. Unlike the
// weight/weekly-bar charts, this always renders the full grid even with no
// data at all: blank cells are themselves meaningful information ("nothing
// done these days"), not a broken or empty state to hide behind a message.
function renderHeatmapSvg(log){
  const totalDays = 91;
  const today = new Date(); today.setHours(0,0,0,0);
  const cells = [];
  for(let i=totalDays-1; i>=0; i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const dateStr = d.toISOString().slice(0,10);
    cells.push({date: dateStr, count: log[dateStr]||0, dow: d.getDay()});
  }
  // Pad the front so the grid starts on a Sunday -- keeps columns as clean,
  // aligned weeks instead of a ragged first column.
  const lead = cells[0].dow;
  for(let i=0;i<lead;i++) cells.unshift({date:null, count:0, dow:i});

  const size = 11, gap = 3, cell = size+gap;
  const cols = Math.ceil(cells.length/7);
  const W = cols*cell, H = 7*cell;
  const rects = cells.map((c,idx)=>{
    if(c.date===null) return '';
    const col = Math.floor(idx/7), row = idx%7;
    const x = (col*cell).toFixed(1), y = (row*cell).toFixed(1);
    // 15+ sets in a day reads as "fully lit" -- a reasonable typical upper
    // bound for one real workout day's total set count, not a precise
    // calibration, since relative intensity across days is what actually
    // matters here, not the exact threshold.
    const pct = Math.min(1, c.count/15);
    const label = c.count>0 ? `${c.count} set${c.count===1?'':'s'}` : 'Rest day';
    return `<rect x="${x}" y="${y}" width="${size}" height="${size}" rx="2.5" fill="${weekBarColor(pct)}"><title>${c.date} -- ${label}</title></rect>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; max-width:${W}px; height:auto;">${rects}</svg>`;
}
function currentWeight(){ return weightLog.length ? weightLog[weightLog.length-1].weight : profile.current_weight; }

async function logWeight(rawValue){
  const val = parseFloat(rawValue);
  if(isNaN(val) || val<70 || val>500){ showError('Enter a valid weight in lbs, e.g. 178'); return; }
  const today = todayISO();
  const previousWeightLog = JSON.parse(JSON.stringify(weightLog)); // for rollback if the save fails
  const idx = weightLog.findIndex(e=>e.date===today);
  if(idx>=0) weightLog[idx].weight = val; else weightLog.push({date:today, weight:val});
  weightLog.sort((a,b)=>a.date.localeCompare(b.date));
  hideError();
  renderDashboard();
  const ok = await saveAll();
  if(!ok){
    // The screen already showed the new weight as logged -- if it didn't
    // actually save, put the real (unsaved) state back so what's on screen
    // always matches what's actually persisted.
    weightLog = previousWeightLog;
  }
  renderDashboard();
}

/* ============================== RECOVERY CHECK-IN (Level 1: reflection only) ==============================
   Deliberately does NOT change suggested weights or reorder days yet. It
   only records how someone says they feel and reflects the pattern back to
   them -- once this data exists and feels trustworthy, it's the foundation
   a later, more active version could build on. */
function todayRecoveryLevel(){
  const today = todayISO();
  const entry = recoveryLog.find(e=>e.date===today);
  return entry ? entry.level : null;
}
function recentWipedCount(days=7){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
  const cutoffISO = todayISOFrom(cutoff);
  return recoveryLog.filter(e=>e.date>=cutoffISO && e.level==='wiped').length;
}
function todayISOFrom(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

async function logRecovery(level){
  if(!['fresh','okay','wiped'].includes(level)) return;
  const today = todayISO();
  const previousRecoveryLog = JSON.parse(JSON.stringify(recoveryLog));
  const idx = recoveryLog.findIndex(e=>e.date===today);
  if(idx>=0) recoveryLog[idx].level = level; else recoveryLog.push({date:today, level});
  hideError();
  renderDashboard();
  const ok = await saveAll();
  if(!ok){ recoveryLog = previousRecoveryLog; }
  renderDashboard();
}

let toggleSaveTimer = null;
let toggleSaveSnapshot = null; // trackerState right before the current pending batch, for rollback if the save fails
function toggleSet(day, exId, idx, total){
  const key = trackerKey(day, exId);
  if(toggleSaveSnapshot === null) toggleSaveSnapshot = JSON.parse(JSON.stringify(trackerState));
  const wasDayComplete = dayProgress(day).pct === 1;
  const wasWeekComplete = plan.days.every(d => dayProgress(d.day).pct === 1);
  if(!trackerState[key]) trackerState[key] = {};
  if(!Array.isArray(trackerState[key].setsChecked) || trackerState[key].setsChecked.length!==total){
    trackerState[key].setsChecked = new Array(total).fill(false);
  }
  trackerState[key].setsChecked[idx] = !trackerState[key].setsChecked[idx];
  if(trackerState[key].setsChecked[idx]) bumpDayActivity(); // only real, new effort counts -- unchecking a mistake shouldn't
  const nowDayComplete = dayProgress(day).pct === 1;
  const nowWeekComplete = plan.days.every(d => dayProgress(d.day).pct === 1);
  renderDashboard();
  if(!wasWeekComplete && nowWeekComplete){
    showMangaBurst(WEEK_COMPLETE_PHRASES[Math.floor(Math.random()*WEEK_COMPLETE_PHRASES.length)], true);
  } else if(!wasDayComplete && nowDayComplete){
    showMangaBurst(DAY_COMPLETE_PHRASES[Math.floor(Math.random()*DAY_COMPLETE_PHRASES.length)]);
  }
  clearTimeout(toggleSaveTimer);
  toggleSaveTimer = setTimeout(async ()=>{
    const snapshot = toggleSaveSnapshot;
    toggleSaveSnapshot = null;
    const ok = await saveAll();
    if(!ok){
      // None of the toggles in this batch actually made it to the database --
      // put the screen back to what's really saved instead of leaving it
      // showing checkmarks that don't exist anywhere but this browser tab.
      trackerState = snapshot;
      renderDashboard();
    }
  }, 350);
}

// The badge in the top-right of every exercise card used to be purely
// informational -- this makes it a real shortcut. A toggle, like every
// other checkbox in the app: if the exercise isn't fully done, one tap
// checks every set at once; if it's already fully done, one tap clears it
// back to nothing, rather than only ever being able to add checks and
// needing the individual set boxes to undo a mistake.
function toggleAllSets(day, exId, total){
  const key = trackerKey(day, exId);
  if(toggleSaveSnapshot === null) toggleSaveSnapshot = JSON.parse(JSON.stringify(trackerState));
  const wasDayComplete = dayProgress(day).pct === 1;
  const wasWeekComplete = plan.days.every(d => dayProgress(d.day).pct === 1);
  if(!trackerState[key]) trackerState[key] = {};
  const current = trackerState[key].setsChecked;
  const currentlyAllDone = Array.isArray(current) && current.length===total && current.every(Boolean);
  trackerState[key].setsChecked = new Array(total).fill(!currentlyAllDone);
  if(!currentlyAllDone) for(let i=0;i<total;i++) bumpDayActivity(); // checking all -- counts as real effort per set, same as checking them one at a time would
  const nowDayComplete = dayProgress(day).pct === 1;
  const nowWeekComplete = plan.days.every(d => dayProgress(d.day).pct === 1);
  renderDashboard();
  if(!wasWeekComplete && nowWeekComplete){
    showMangaBurst(WEEK_COMPLETE_PHRASES[Math.floor(Math.random()*WEEK_COMPLETE_PHRASES.length)], true);
  } else if(!wasDayComplete && nowDayComplete){
    showMangaBurst(DAY_COMPLETE_PHRASES[Math.floor(Math.random()*DAY_COMPLETE_PHRASES.length)]);
  }
  clearTimeout(toggleSaveTimer);
  toggleSaveTimer = setTimeout(async ()=>{
    const snapshot = toggleSaveSnapshot;
    toggleSaveSnapshot = null;
    const ok = await saveAll();
    if(!ok){
      trackerState = snapshot;
      renderDashboard();
    }
  }, 350);
}

// Reads and validates the shared form fields for a given prefix ('newEx' or 'editEx').
// Shows the global error banner and returns null on failure.
function readExerciseForm(prefix){
  const name = document.getElementById(prefix+'Name').value.trim();
  const muscle = document.getElementById(prefix+'Muscle').value;
  const setsRaw = document.getElementById(prefix+'Sets').value;
  const reps = document.getElementById(prefix+'Reps').value.trim();
  const weightRaw = document.getElementById(prefix+'Weight').value;
  const unit = document.getElementById(prefix+'Unit').value;

  if(!name){ showError('Enter an exercise name.'); return null; }
  const sets = parseInt(setsRaw, 10);
  if(isNaN(sets) || sets < 1 || sets > 10){ showError('Sets must be a number between 1 and 10.'); return null; }
  if(!reps){ showError('Enter a rep range or duration, e.g. 8-12 or 20 min.'); return null; }
  let weight = '—';
  if(unit !== 'bodyweight'){
    const w = parseFloat(weightRaw);
    if(isNaN(w) || w <= 0){ showError('Enter a weight, or switch the unit to Bodyweight.'); return null; }
    weight = String(w);
  }
  hideError();
  return {
    name: name.slice(0,60), muscle, sets, reps: reps.slice(0,30), weight, unit,
    tag: MUSCLE_LABEL[muscle] || 'Custom', muscles: describeMuscle(muscle),
  };
}

let exCrudInFlight = false; // guards against a fast double-click firing the same add/edit/delete twice

async function handleSaveAddEx(){
  if(exCrudInFlight) return;
  const v = readExerciseForm('newEx');
  if(!v) return;
  exCrudInFlight = true;
  const newEx = {id:'custom_'+Date.now(), name:v.name, tag:v.tag, sets:v.sets, reps:v.reps, weight:v.weight, unit:v.unit, muscles:v.muscles};
  const dayObj = plan.days.find(x=>x.day===activeDay);
  dayObj.exercises.push(newEx);
  addFormOpen = false;
  renderDashboard();
  const ok = await saveAll();
  if(!ok){
    // Wasn't actually saved -- don't leave it looking like it was.
    dayObj.exercises = dayObj.exercises.filter(e=>e.id!==newEx.id);
  }
  exCrudInFlight = false;
  renderDashboard();
}

async function handleSaveEditEx(exId){
  if(exCrudInFlight) return;
  const v = readExerciseForm('editEx');
  if(!v) return;
  const dayObj = plan.days.find(x=>x.day===activeDay);
  const ex = dayObj.exercises.find(e=>e.id===exId);
  if(!ex) return;
  exCrudInFlight = true;
  const previous = {...ex};
  const previousCheckmarks = trackerState[trackerKey(activeDay, ex.id)];
  ex.name = v.name; ex.tag = v.tag; ex.sets = v.sets; ex.reps = v.reps;
  ex.weight = v.weight; ex.unit = v.unit; ex.muscles = v.muscles;
  delete trackerState[trackerKey(activeDay, ex.id)]; // sets count may have changed — drop any stale checkmarks
  editingExId = null;
  renderDashboard();
  const ok = await saveAll();
  if(!ok){
    Object.assign(ex, previous);
    if(previousCheckmarks) trackerState[trackerKey(activeDay, ex.id)] = previousCheckmarks;
  }
  exCrudInFlight = false;
  renderDashboard();
}

async function handleDeleteEx(exId){
  if(exCrudInFlight) return;
  exCrudInFlight = true;
  const dayObj = plan.days.find(x=>x.day===activeDay);
  const removedIndex = dayObj.exercises.findIndex(e=>e.id===exId);
  const removedEx = dayObj.exercises[removedIndex];
  const removedCheckmarks = trackerState[trackerKey(activeDay, exId)];
  dayObj.exercises = dayObj.exercises.filter(e=>e.id!==exId);
  delete trackerState[trackerKey(activeDay, exId)];
  deleteConfirmExId = null;
  renderDashboard();
  const ok = await saveAll();
  if(!ok && removedEx){
    dayObj.exercises.splice(removedIndex, 0, removedEx);
    if(removedCheckmarks) trackerState[trackerKey(activeDay, exId)] = removedCheckmarks;
  }
  exCrudInFlight = false;
  renderDashboard();
}

      <button class="bottom-tab ${dashboardPage==='workout'?'active':''}" data-page="workout"><span class="bt-icon">◫</span>WORKOUT</button>
      <button class="bottom-tab ${dashboardPage==='sports'?'active':''}" data-page="sports"><span class="bt-icon">◎</span>SPORTS</button>
      <button class="bottom-tab ${dashboardPage==='arc'?'active':''}" data-page="arc"><span class="bt-icon">◇</span>ARC</button>

  document.querySelectorAll('[data-side-page]').forEach(btn=>{ btn.onclick=()=>{ const pg=btn.dataset.sidePage; if(pg==='sensei'){ openCoachChat(); return; } dashboardPage=pg; renderDashboard(); }; });
  const gmSideLogout=document.getElementById('gmSideLogout'); if(gmSideLogout) gmSideLogout.onclick=()=>document.getElementById('signOutLink')?.click();

  if(dashboardPage==='workout'){
    // day tabs
    const tabsWrap = document.getElementById('dayTabs');
    plan.days.forEach(dd=>{
      const {pct:tp} = dayProgress(dd.day);
      const btn = document.createElement('div');
      btn.className = 'day-tab' + (dd.day===activeDay?' active':'') + (tp===1?' complete':'');
      btn.dataset.split = dd.split;
      btn.style.setProperty('--accent', `var(--${dd.split})`);
      const flag = dd.day===upNext ? `<span class="today-flag">Up Next</span>` : '';
      btn.innerHTML = `${flag}<span class="dnum">${dd.day}</span><span class="dsplit">${dd.split}</span><span class="dot"></span>`;
      btn.onclick = ()=> goToDay(dd.day);
      tabsWrap.appendChild(btn);
    });

    // day content
    const isUpNext = d.day === upNext;
    const header = `
    <div class="day-header ${d.split}">
      <div class="day-header-bg"></div>
      <span class="eyebrow">Day ${d.day} of ${N}${isUpNext ? `<span class="today-pill">Up Next</span>`:''}</span>
      <h2>${escapeHtml(d.title)}</h2>
      <div class="tagline">${escapeHtml(d.tagline)}</div>
      <div class="meta"><span>${escapeHtml(d.subtitle)}</span></div>
      <div class="meta"><span>${done}/${total} exercises logged</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${dayPct*100}%"></div></div>
    </div>`;
  const cards = d.exercises.map(ex=>{
    if(editingExId === ex.id){
      return editExerciseFormHtml(ex);
    }
    const s = trackerState[trackerKey(d.day, ex.id)] || {};
    const setsChecked = (Array.isArray(s.setsChecked) && s.setsChecked.length===ex.sets) ? s.setsChecked : new Array(ex.sets).fill(false);
    const isDone = isExerciseDone(ex, s);
    const confirmingDelete = deleteConfirmExId === ex.id;
    return `
    <div class="ex-card ${isDone?'done':''}">
      <div class="rail ${d.split}"></div>
      <div class="ex-main">
        <div class="ex-top">
          <div>
            <span class="ex-tag">${escapeHtml(ex.tag)} · ${ex.sets} ${ex.sets===1?'set':'sets'} × ${escapeHtml(ex.reps)}</span>
            <div class="ex-name ${isDone?'done-text':''}">${escapeHtml(ex.name)}</div>
          </div>
          <div class="status-badge ${isDone?'checked':''}" data-toggle-all="${ex.id}|${ex.sets}">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
        </div>
        <div class="ex-muscles"><b>Targets:</b> ${escapeHtml(ex.muscles)}</div>
        <div class="ex-inputs">
          <div class="field"><label>Suggested weight</label><div class="weight-label">${ex.weight}<span class="unit">${ex.unit}</span></div></div>
          <div class="field">
            <label>Sets ${setsChecked.filter(Boolean).length}/${ex.sets}</label>
            <div class="sets-row">
              ${Array.from({length:ex.sets}).map((_,i)=>`
                <div class="set-check ${setsChecked[i]?'checked':''}" data-set="${ex.id}|${i}|${ex.sets}">
                  ${setsChecked[i] ? `<svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>` : (i+1)}
                </div>`).join('')}
            </div>
          </div>
        </div>
        ${confirmingDelete ? `
          <div class="confirm-box">
            Remove this exercise from today's plan?
            <div class="row">
              <button data-cancel-del="${ex.id}">Cancel</button>
              <button class="danger" data-confirm-del="${ex.id}">Remove</button>
            </div>
          </div>` : `
          <div class="ex-actions">
            ${(ex.unit!=='bodyweight' && exerciseHistory[ex.id] && exerciseHistory[ex.id].length>0) ? `
              <button class="icon-btn-sm" data-coach-ex="${ex.id}" title="Sensei coaching note">🤖</button>
            ` : ''}
            <button class="icon-btn-sm" data-edit-ex="${ex.id}" title="Edit">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
            </button>
            <button class="icon-btn-sm danger" data-del-ex="${ex.id}" title="Delete">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          </div>`}
        ${coachingNoteExId===ex.id ? `
          <div class="coach-note">
            ${coachingNoteLoading ? 'Sensei is thinking…' : coachingNoteError ? `⚠ ${escapeHtml(coachingNoteError)}` : `Sensei: ${escapeHtml(coachingNoteText)}`}
          </div>` : ''}
      </div>
    </div>`;
  }).join('');
  const emptyState = d.exercises.length === 0 ? `
    <div class="ex-card" style="padding:16px;">
      <div class="ex-main">
        <div class="ex-name" style="margin-bottom:6px;">No exercises fit this day</div>
        <div class="ex-muscles" style="border-top:none; padding-top:0; margin-top:0;">
          Your equipment and avoid-areas settings ruled out everything available for this muscle group. Consider updating your equipment access, clearing an avoid-area, or working this pattern with a physical therapist or trainer directly.
        </div>
      </div>
    </div>` : '';
  const addExSection = addFormOpen
    ? addExerciseFormHtml()
    : `<div class="add-ex-row" ${d.exercises.length===0?'style="border-top:none; padding-top:0;"':''}><button class="btn-secondary" id="openAddForm">+ Add Exercise</button></div>`;
  document.getElementById('dayContent').innerHTML = header + `<div class="ex-list">${cards}${emptyState}</div>` + addExSection;
  document.querySelectorAll('[data-set]').forEach(el=>{
    el.onclick = ()=>{ const [exId,idx,tot] = el.dataset.set.split('|'); toggleSet(activeDay, exId, parseInt(idx,10), parseInt(tot,10)); };
  });
  document.querySelectorAll('[data-toggle-all]').forEach(el=>{
    el.onclick = ()=>{ const [exId,tot] = el.dataset.toggleAll.split('|'); toggleAllSets(activeDay, exId, parseInt(tot,10)); };
  });
  document.querySelectorAll('[data-edit-ex]').forEach(el=>{
    el.onclick = ()=>{ editingExId = el.dataset.editEx; deleteConfirmExId = null; addFormOpen = false; renderDashboard(); };
  });
  document.querySelectorAll('[data-coach-ex]').forEach(el=>{
    el.onclick = ()=>{ getCoachingNote(el.dataset.coachEx); };
  });
  document.querySelectorAll('[data-del-ex]').forEach(el=>{
    el.onclick = ()=>{ deleteConfirmExId = el.dataset.delEx; editingExId = null; renderDashboard(); };
  });
  document.querySelectorAll('[data-cancel-del]').forEach(el=>{
    el.onclick = ()=>{ deleteConfirmExId = null; renderDashboard(); };
  });
  document.querySelectorAll('[data-confirm-del]').forEach(el=>{
    el.onclick = ()=>{ handleDeleteEx(el.dataset.confirmDel); };
  });
  const cancelEditBtn = document.getElementById('cancelEditEx');
  if(cancelEditBtn) cancelEditBtn.onclick = ()=>{ editingExId = null; renderDashboard(); };
  const saveEditBtn = document.getElementById('saveEditEx');
  if(saveEditBtn) saveEditBtn.onclick = ()=> handleSaveEditEx(editingExId);
  const openAddBtn = document.getElementById('openAddForm');
  if(openAddBtn) openAddBtn.onclick = ()=>{ addFormOpen = true; editingExId = null; renderDashboard(); };
  const cancelAddBtn = document.getElementById('cancelAddEx');
  if(cancelAddBtn) cancelAddBtn.onclick = ()=>{ addFormOpen = false; hideError(); renderDashboard(); };
  const saveAddBtn = document.getElementById('saveAddEx');
  if(saveAddBtn) saveAddBtn.onclick = handleSaveAddEx;

  if(hasPrev) document.getElementById('prevDayBtn').onclick = ()=> goToDay(plan.days[dayIdx-1].day);
  if(hasNext) document.getElementById('nextDayBtn').onclick = ()=> goToDay(plan.days[dayIdx+1].day);
  document.getElementById('resetBtn').onclick = async ()=>{
    plan.days.forEach(dd=> dd.exercises.forEach(ex=> delete trackerState[trackerKey(dd.day, ex.id)]));
    await saveAll();
    renderDashboard();
  };
  } // end dashboardPage==='workout'

  if(dashboardPage==='overview'){
    const wBtn = document.getElementById('logWeightBtn');
    const wInp = document.getElementById('weightInput');
    wBtn.onclick = ()=>{ logWeight(wInp.value); wInp.value=''; };
    wInp.addEventListener('keydown', e=>{ if(e.key==='Enter') wBtn.click(); });
    document.querySelectorAll('.recovery-btn').forEach(btn=>{
      btn.onclick = ()=>{ recoveryEditing = false; logRecovery(btn.dataset.level); };
    });
    const recoveryChangeBtn = document.getElementById('recoveryChangeBtn');
    if(recoveryChangeBtn) recoveryChangeBtn.onclick = ()=>{ recoveryEditing = true; renderDashboard(); };
    const weightToggle = document.getElementById('weightDetailsToggle');
    if(weightToggle) weightToggle.onclick = ()=>{ weightDetailsOpen = !weightDetailsOpen; renderDashboard(); };
    document.querySelectorAll('[data-range]').forEach(el=>{
      el.onclick = ()=>{ weightChartRange = el.dataset.range; renderDashboard(); };
    });
    const dietToggle = document.getElementById('dietDetailsToggle');
    if(dietToggle) dietToggle.onclick = ()=>{ dietDetailsOpen = !dietDetailsOpen; renderDashboard(); };
  }

  // bindings shared by both pages
  document.getElementById('accountLink').onclick = ()=>{ APP_STATE='account'; render(); };
  document.getElementById('themeToggleBtn').onclick = toggleTheme;
  document.getElementById('signOutLink').onclick = handleSignOut;
  document.getElementById('openCoachChat').onclick = openCoachChat;
  const sportSenseiBtn = document.getElementById('sportSenseiBtn');
  if(sportSenseiBtn) sportSenseiBtn.onclick = openCoachChat;
  const moreAccountBtn = document.getElementById('moreAccountBtn');
  if(moreAccountBtn) moreAccountBtn.onclick = ()=>{ APP_STATE='account'; render(); };
  document.querySelectorAll('.bottom-tab').forEach(btn=>{
    btn.onclick = ()=> btn.dataset.page==='sensei' ? openCoachChat() : setDashboardPage(btn.dataset.page);
  });
  const sportsEditPlanBtn = document.getElementById('sportsEditPlanBtn');
  if(sportsEditPlanBtn) sportsEditPlanBtn.onclick = ()=>{ APP_STATE='account'; render(); };
  renderSaveStatus();
}

function setDashboardPage(page){
  if(page === dashboardPage) return;
  dashboardPage = page;
  renderDashboard();
}

    document.getElementById('cancelChangePw').onclick = ()=>{ hideError(); document.getElementById('changePasswordArea').innerHTML = ''; };
    document.getElementById('saveChangePw').onclick = async ()=>{
      const ok = await handleUpdatePassword(document.getElementById('acctNewPw').value, document.getElementById('acctNewPw2').value);
      if(ok) document.getElementById('changePasswordArea').innerHTML = '';
    };
    wirePasswordToggles();
  };
  document.getElementById('deleteDataBtn').onclick = ()=>{
    deleteConfirmOpen = true;
    document.getElementById('deleteConfirmArea').innerHTML = `
      <div class="confirm-box">
        This permanently deletes your profile, plan, weight log, and workout history. Your login itself stays active — you could sign back in and start the questionnaire fresh. If you want your login removed too, use "Permanently Delete Account" instead. This cannot be undone.
        <div class="row">
          <button id="cancelDelete">Cancel</button>
          <button class="danger" id="reallyDelete">Yes, Erase My Data</button>
        </div>
      </div>`;
    document.getElementById('cancelDelete').onclick = ()=>{ deleteConfirmOpen=false; document.getElementById('deleteConfirmArea').innerHTML=''; };
    document.getElementById('reallyDelete').onclick = confirmDeleteData;
  };
  document.getElementById('deleteAccountBtn').onclick = ()=>{
    document.getElementById('permDeleteConfirmArea').innerHTML = `
      <div class="confirm-box">
        This deletes everything "Erase My Data" does, PLUS your actual login itself. You will not be able to sign back in with this email afterward, and there is no way to undo this. Type your email to confirm.
        <input type="text" id="permDeleteConfirmEmail" placeholder="${escapeHtml(currentUser.email)}" style="width:100%; margin-top:10px; padding:9px 11px; border-radius:8px; border:1.5px solid var(--line); background:var(--bg-2); color:var(--ink); font-size:13px;">
        <div class="row">
          <button id="cancelPermDelete">Cancel</button>
          <button class="danger" id="reallyPermDelete">Permanently Delete Everything</button>
        </div>
      </div>`;
    document.getElementById('cancelPermDelete').onclick = ()=>{ document.getElementById('permDeleteConfirmArea').innerHTML=''; };
    document.getElementById('reallyPermDelete').onclick = ()=>{
      const typed = document.getElementById('permDeleteConfirmEmail').value.trim();
      if(typed.toLowerCase() !== currentUser.email.toLowerCase()){
        showError('Type your email exactly to confirm permanent deletion.');
        return;
      }
      confirmPermanentDelete();
    };
  };
}

function render(){
  if(APP_STATE==='loading') root().innerHTML = `<div class="loading">Loading…</div>`;
  else if(APP_STATE==='signin') renderSignIn();
  else if(APP_STATE==='signup') renderSignUp();
  else if(APP_STATE==='check-email') renderCheckEmail();
  else if(APP_STATE==='forgot-password') renderForgotPassword();
  else if(APP_STATE==='reset-email-sent') renderResetEmailSent();
  else if(APP_STATE==='reset-password') renderResetPassword();
  else if(APP_STATE==='questionnaire') renderQuestionnaire();
  else if(APP_STATE==='chat-intake') renderChatIntake();
  else if(APP_STATE==='coach') renderCoach();
  else if(APP_STATE==='dashboard') renderDashboard();
  else if(APP_STATE==='account') renderAccount();
}

/* ============================== INIT ============================== */
let confirmToastShown = false;
function maybeShowConfirmToast(){
  if(arrivedViaEmailConfirm && !confirmToastShown){
    confirmToastShown = true;
    showToast('✓ Email confirmed — you\'re in!');
  }
}
function maybeShowStreakToast(){
  if(pendingStreakToast){
    showToast(pendingStreakToast);
    pendingStreakToast = null;
  }
  if(pendingProgressionToast){
    showToast(pendingProgressionToast);
    pendingProgressionToast = null;
  }
  if(pendingRecoveryToast){
    showRecoveryToast(pendingRecoveryToast);
    pendingRecoveryToast = null;
  }
}

function setupSwipeGestures(){
  // Swipe now switches between the Overview and Workout pages instead of
  // between workout days -- day-to-day navigation still works fine via the
  // day tabs and the prev/next chevrons, both of which are plain taps, not
  // swipes, so nothing about moving between days actually breaks here.
  let touchStartX = null, touchStartY = null;
  document.addEventListener('touchstart', (e)=>{
    if(APP_STATE!=='dashboard'){ touchStartX = null; return; }
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchend', (e)=>{
    const focused = document.activeElement;
    const inTextField = focused && (focused.tagName==='INPUT' || focused.tagName==='TEXTAREA');
    if(touchStartX===null || APP_STATE!=='dashboard' || addFormOpen || editingExId || inTextField){ touchStartX = null; return; }
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    touchStartX = null;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)*1.5) return;
    if(dx < 0 && dashboardPage==='overview') setDashboardPage('workout');
    else if(dx > 0 && dashboardPage==='workout') setDashboardPage('overview');
  }, {passive:true});
}

// Wraps a promise so it can never hang forever -- if it hasn't settled within
// `ms`, we stop waiting and proceed as if it returned `timeoutValue`, rather
// than leaving the whole app stuck (e.g. a dead connection previously left
// the page frozen on the initial "Loading…" screen with no way out).
function withTimeout(promise, ms, timeoutValue){
  return Promise.race([
    promise,
    new Promise(resolve => setTimeout(()=>resolve(timeoutValue), ms)),
  ]);
}

let sessionHandledOnce = false; // prevents init()'s own check and the auth listener's first event from both loading data for the same session
async function init(){
  let session = null, timedOut = false;
  try{
    const result = await withTimeout(sb.auth.getSession(), 9000, {__timedOut:true});
    if(result.__timedOut) timedOut = true;
    else session = result.data.session;
  }catch(e){
    timedOut = true; // treat a thrown error here the same as a timeout -- either way, stop waiting and let the person try to sign in
  }

  if(arrivedViaPasswordRecovery){
    currentUser = session ? session.user : null;
    APP_STATE = 'reset-password';
    render();
  } else if(session){
    sessionHandledOnce = true;
    currentUser = session.user;
    await loadProfileAndData();
    maybeShowConfirmToast();
    maybeShowStreakToast();
  } else {
    APP_STATE = 'signin';
    render();
    if(timedOut) showError("Couldn't connect — check your internet connection and try signing in.");
  }

  sb.auth.onAuthStateChange((event, session)=>{
    if(event === 'PASSWORD_RECOVERY'){
      currentUser = session.user;
      APP_STATE = 'reset-password';
      render();
    } else if(event==='SIGNED_IN' && session && !sessionHandledOnce){
      sessionHandledOnce = true;
      currentUser = session.user;
      loadProfileAndData().then(()=>{ maybeShowConfirmToast(); maybeShowStreakToast(); });
    } else if(event==='SIGNED_OUT'){
      sessionHandledOnce = false;
      currentUser = null; profile = null; plan = null;
      APP_STATE = 'signin'; render();
    }
  });

  setupSwipeGestures();
}
init();
</script>
