<!DOCTYPE html>
<!-- GRIND MODE Manga Training Arc — deployable build, regression verified 2026-09-14 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRIND MODE — Personalized</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #0A0A0C;
    --bg-2: #131316;
    --card: #1A1A1F;
    --line: #2E2E36;
    --ink: #F5F3EC;
    --muted: #8B8A94;
    --gold: #F2B705;
    --gold-dim: #4A3B0E;
    --bad-text: #ffb3c0;
    --bad-text-sub: #c98a95;
    /* Heatmap tiers below full intensity (which already uses --gold) --
       these were hardcoded hex values before, meaning they looked fine on
       the dark canvas they were designed for but read as near-black,
       barely-distinguishable blocks once the surrounding page went light.
       Giving each tier its own variable lets light mode use an actual light
       scale instead of inheriting dark-mode-only colors. */
    --heat-3: #c99b0c;
    --heat-2: #8a6c10;
    --heat-1: #4a3b0e;
    --heat-0: #2a2410;
    /* These three stay constant across BOTH themes on purpose. The hero and
       day-header cards always sit on a dark photo + dark scrim regardless of
       whether the app is in light or dark mode -- only the surrounding page
       changes. Text on those specific cards needs to stay light/vivid always;
       using the theme-flipping --ink/--muted/--gold there made heading text
       go near-black on a still-dark card the moment someone switched to
       light mode. */
    --on-photo-heading: #F5F3EC;
    --on-photo-muted: #C9C7D1;
    --on-photo-gold: #F2B705;
    --push: #FF3B30;
    --push-bg: #2E1210;
    --push-line: #5C2019;
    --pull: #00B4D8;
    --pull-bg: #0E252C;
    --pull-line: #144C5C;
    --legs: #B14EFF;
    --legs-bg: #251230;
    --legs-line: #4A2160;
    --good: #39FF6A;
    --good-bg: #0F2A16;
    --bad: #FF2E63;
    --bad-bg: #2E0F18;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:
      radial-gradient(circle at 10% -5%, rgba(255,59,48,0.14), transparent 40%),
      radial-gradient(circle at 95% 10%, rgba(0,180,216,0.12), transparent 40%),
      radial-gradient(circle at 50% 105%, rgba(177,78,255,0.13), transparent 50%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  }
  body{padding-bottom:60px;}
  .wrap{max-width:640px; margin:0 auto; padding:22px 16px 0;}

  .page-bg{
    position:fixed; inset:0; z-index:-1;
    background-image:url('https://images.pexels.com/photos/28320723/pexels-photo-28320723.jpeg?auto=compress&w=1600');
    background-size:cover; background-position:center;
    filter:grayscale(1) contrast(1.1) brightness(0.9);
  }
  .page-bg::after{
    content:''; position:absolute; inset:0;
    background:rgba(6,6,8,0.75);
  }

  .error-banner{
    display:none; align-items:center; gap:10px;
    background:var(--bad-bg);
    border:1.5px solid var(--bad); color:#FFB4C6;
    border-radius:10px; padding:11px 14px; margin-bottom:14px; font-size:13px; font-weight:600;
  }
  .error-banner.show{display:flex;}
  .error-banner svg{flex-shrink:0; width:18px; height:18px; stroke:var(--bad);}
  .error-banner .msg{flex:1;}
  .error-banner button{background:none; border:none; color:#FFB4C6; font-size:16px; cursor:pointer; line-height:1; padding:2px 4px;}

  .stats-strip{
    background:var(--card); border:1.5px solid var(--gold-dim); border-radius:12px;
    padding:12px 16px; margin-bottom:16px; display:flex; align-items:center; gap:10px;
    font-size:12px; color:var(--muted); line-height:1.5;
  }
  .stats-strip svg{flex-shrink:0; width:18px; height:18px; stroke:var(--gold); margin-top:1px;}
  .stats-strip b{color:var(--gold); font-weight:700;}

  .title-block{position:relative;}
  .title-block h1{
    font-family:'Bungee', sans-serif; font-size:26px; letter-spacing:0.5px; line-height:1.05;
    color:var(--gold); text-shadow: 2px 2px 0 rgba(0,0,0,0.6), 0 0 22px rgba(242,183,5,0.35);
  }
  .title-block p{color:var(--muted); font-size:11px; margin-top:6px; letter-spacing:1.2px; font-weight:700; text-transform:uppercase;}
  .q-exit-btn{
    position:absolute; top:0; right:0; width:32px; height:32px; border-radius:50%;
    border:1.5px solid var(--line); background:var(--card); color:var(--muted);
    font-size:14px; cursor:pointer; line-height:1;
  }

  .day-tabs{display:grid; gap:7px; margin-bottom:18px;}
  .day-tab{
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    padding:9px 2px 8px; text-align:center; cursor:pointer; transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    position:relative;
  }
  .day-tab:active{transform:scale(0.94);}
  .day-tab .dnum{font-family:'Teko',sans-serif; font-weight:700; font-size:26px; line-height:0.8; display:block;}
  .day-tab .dsplit{font-size:8.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); display:block; margin-top:4px; font-weight:700;}
  .day-tab.active{border-color:var(--accent); box-shadow:0 0 0 1.5px var(--accent), 0 0 16px -3px var(--accent);}
  .day-tab .dot{position:absolute; top:6px; right:6px; width:6px; height:6px; border-radius:50%; opacity:0; box-shadow:0 0 8px var(--good);}
  .day-tab.complete .dot{opacity:1; background:var(--good);}
  .day-tab .today-flag{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#161616; font-size:7.5px; font-weight:800; letter-spacing:0.5px;
    padding:2px 6px; border-radius:6px; white-space:nowrap; text-transform:uppercase;
  }
  .day-tab[data-split="push"] .dnum{color:var(--push);}
  .day-tab[data-split="pull"] .dnum{color:var(--pull);}
  .day-tab[data-split="legs"] .dnum{color:var(--legs);}

  .day-header{border-radius:16px; padding:20px 20px 18px; margin-bottom:16px; position:relative; z-index:0; overflow:hidden; border:1.5px solid var(--line);}
  .day-header > .day-header-bg{
    position:absolute; inset:0; z-index:-1;
    background-size:cover; background-position:center;
    filter:grayscale(1) contrast(1.15) brightness(1.15);
  }
  .day-header > .day-header-bg::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(0,0,0,0.68) 32%, rgba(0,0,0,0.08) 100%);
  }
  .day-header.push .day-header-bg{
    background-image:url('https://images.pexels.com/photos/11433060/pexels-photo-11433060.jpeg?auto=compress&w=800');
    filter:grayscale(1) contrast(1.05) brightness(1.65);
  }
  .day-header.pull .day-header-bg{
    background-image:url('https://images.pexels.com/photos/6455961/pexels-photo-6455961.jpeg?auto=compress&w=800');
  }
  .day-header.legs .day-header-bg{
    background-image:url('https://images.pexels.com/photos/9602276/pexels-photo-9602276.jpeg?auto=compress&w=800');
  }
  .day-header::before{
    content:''; position:absolute; top:0; right:0; width:0; height:0;
    border-style:solid; border-width:0 64px 64px 0;
    border-color:transparent rgba(255,255,255,0.07) transparent transparent;
    pointer-events:none; z-index:0;
  }
  .day-header > *{position:relative; z-index:1;}
  .day-header.push{background:linear-gradient(135deg, var(--push-bg), var(--card) 75%); border-color:var(--push-line);}
  .day-header.pull{background:linear-gradient(135deg, var(--pull-bg), var(--card) 75%); border-color:var(--pull-line);}
  .day-header.legs{background:linear-gradient(135deg, var(--legs-bg), var(--card) 75%); border-color:var(--legs-line);}
  .day-header .eyebrow{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--on-photo-muted); font-weight:700; display:flex; align-items:center; gap:8px;}
  .day-header .eyebrow .today-pill{background:var(--on-photo-gold); color:#161616; font-size:9px; padding:2px 8px; border-radius:20px; letter-spacing:0.5px; font-weight:800;}
  .day-header h2{font-family:'Bungee',sans-serif; font-size:28px; letter-spacing:0.3px; margin-top:6px; color:var(--on-photo-heading); text-shadow:2px 2px 0 rgba(0,0,0,0.5);}
  .day-header .tagline{
    font-family:'Teko',sans-serif; font-weight:700; font-size:18px; letter-spacing:0.8px; margin-top:2px;
    -webkit-text-stroke:0.5px rgba(0,0,0,0.4); text-transform:uppercase;
  }
  .day-header.push .tagline{color:var(--push); text-shadow:1.5px 1.5px 0 rgba(0,0,0,0.35);}
  .day-header.pull .tagline{color:var(--pull); text-shadow:1.5px 1.5px 0 rgba(0,0,0,0.35);}
  .day-header.legs .tagline{color:var(--legs); text-shadow:1.5px 1.5px 0 rgba(0,0,0,0.35);}
  .day-header .meta{display:flex; gap:14px; margin-top:9px; font-size:12.5px; color:var(--on-photo-muted); font-family:'JetBrains Mono',monospace; font-weight:500;}
  .day-header .progress-bar{height:6px; border-radius:4px; background:rgba(255,255,255,0.08); margin-top:14px; overflow:hidden;}
  .day-header .progress-fill{height:100%; border-radius:4px; transition:width .3s ease;}
  .day-header.push .progress-fill{background:linear-gradient(90deg, var(--push), #FF8A5C); box-shadow:0 0 10px var(--push);}
  .day-header.pull .progress-fill{background:linear-gradient(90deg, var(--pull), #7FE3FF); box-shadow:0 0 10px var(--pull);}
  .day-header.legs .progress-fill{background:linear-gradient(90deg, var(--legs), #E0AFFF); box-shadow:0 0 10px var(--legs);}

  /* --- Manga impact burst (day/week completion celebration) --- */
  .manga-burst{
    position:fixed; top:50%; left:50%; z-index:9999; pointer-events:none;
    animation:mangaPop 1.6s cubic-bezier(.2,1,.3,1) forwards;
  }
  .manga-burst-shape{
    position:absolute; top:50%; left:50%; width:340px; height:340px;
    transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg, var(--gold) 0deg 4deg, transparent 4deg 14deg);
    border-radius:50%; opacity:0.85; z-index:-1;
  }
  .manga-burst.big .manga-burst-shape{width:420px; height:420px; background:repeating-conic-gradient(from 0deg, var(--legs) 0deg 4deg, transparent 4deg 14deg);}
  .manga-burst-text{
    position:relative; display:block; font-family:'Bungee',sans-serif; letter-spacing:0.5px;
    font-size:26px; color:#fff; -webkit-text-stroke:3px #0A0A0C; text-transform:uppercase;
    text-shadow:4px 4px 0 var(--push), -1px -1px 0 #0A0A0C; padding:20px 34px; white-space:nowrap;
    transform:translate(-50%,-50%) rotate(-6deg); top:50%; left:50%; position:absolute;
  }
  .manga-burst.big .manga-burst-text{font-size:30px; text-shadow:4px 4px 0 var(--legs), -1px -1px 0 #0A0A0C;}
  @keyframes mangaPop{
    0%{opacity:0;} 8%{opacity:1;}
    0%,8%{ transform:translate(-50%,-50%) scale(0.35); }
    22%{ transform:translate(-50%,-50%) scale(1.12); }
    32%{ transform:translate(-50%,-50%) scale(1); }
    80%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1.05); }
  }

  .ex-list{display:flex; flex-direction:column; gap:11px;}
  .ex-card{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:14px 15px 14px 0; display:flex; gap:0; align-items:stretch; transition:border-color .15s ease, box-shadow .15s ease;}
  .ex-card.done{border-color:var(--good); box-shadow:0 0 16px -6px rgba(57,255,106,0.35);}
  .rail{width:5px; border-radius:4px; margin:2px 14px 2px 0; flex-shrink:0;}
  .rail.push{background:var(--push); box-shadow:0 0 8px var(--push);}
  .rail.pull{background:var(--pull); box-shadow:0 0 8px var(--pull);}
  .rail.legs{background:var(--legs); box-shadow:0 0 8px var(--legs);}

  .ex-main{flex:1; min-width:0;}
  .ex-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .ex-name{font-size:15px; font-weight:800; line-height:1.25; color:var(--ink);}
  .ex-name.done-text{text-decoration:line-through; color:var(--muted);}
  .ex-tag{font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); font-weight:700; margin-top:2px; display:block;}

  .status-badge{width:27px; height:27px; border-radius:8px; border:2px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s ease; background:var(--bg-2); cursor:pointer;}
  .status-badge.checked{background:var(--good); border-color:var(--good); box-shadow:0 0 12px rgba(57,255,106,0.55);}
  .status-badge svg{width:15px; height:15px; opacity:0; transition:opacity .1s ease;}
  .status-badge.checked svg{opacity:1;}

  .ex-muscles{font-size:11.5px; line-height:1.5; color:var(--muted); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}
  .ex-muscles b{color:var(--gold); font-weight:700;}

  .ex-inputs{display:flex; gap:8px; margin-top:11px;}
  .ex-inputs .field{flex:1;}
  .ex-inputs label{font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:3px; font-weight:700;}

  .sets-row{display:flex; gap:5px; flex-wrap:wrap;}
  .set-check{width:26px; height:26px; border-radius:7px; border:1.5px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .15s ease; background:var(--bg-2); color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;}
  .set-check.checked{background:var(--good); border-color:var(--good); color:#0A0A0C; box-shadow:0 0 10px rgba(57,255,106,0.45);}
  .set-check svg{width:13px; height:13px;}
  .set-check:active{transform:scale(0.92);}

  .weight-label{width:100%; background:var(--bg-2); border:1.5px solid var(--gold-dim); border-radius:8px; color:var(--gold); font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; padding:7px 8px; display:flex; align-items:baseline; gap:4px;}
  .weight-label .unit{font-size:10px; font-weight:600; color:var(--muted);}

  .weight-card{background:var(--card); border:1.5px solid var(--gold-dim); border-radius:16px; padding:18px 18px 16px; margin-bottom:18px;}
  .recovery-card{background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:18px;}
  .recovery-prompt{font-size:13px; font-weight:700; color:var(--ink); margin-bottom:10px;}
  .recovery-options{display:flex; gap:8px;}
  .recovery-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg-2); font-size:20px; cursor:pointer; color:var(--ink);}
  .recovery-btn span{font-size:11px; font-family:'Teko',sans-serif; letter-spacing:0.3px;}
  .recovery-btn:active{transform:scale(0.96);}
  .recovery-done{display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--ink);}
  .recovery-done button{background:none; border:none; color:var(--gold); font-family:'Teko',sans-serif; font-size:13px; letter-spacing:0.3px; cursor:pointer; padding:4px 8px;}
  .recovery-note{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); line-height:1.5;}
  .weight-head{display:flex; align-items:flex-end; justify-content:space-between; gap:10px;}
  .weight-label-sm{font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px; color:var(--muted); font-weight:700;}
  .weight-current{font-family:'Bungee',sans-serif; font-size:32px; color:var(--gold); line-height:1; margin-top:4px;}
  .weight-current .weight-unit{font-family:'Inter',sans-serif; font-size:13px; color:var(--muted); font-weight:700; margin-left:4px;}
  .weight-goal-chip{background:var(--bg-2); border:1px solid var(--line); border-radius:20px; padding:5px 12px; font-size:11px; font-weight:700; color:var(--ink); white-space:nowrap; font-family:'Teko',sans-serif; letter-spacing:0.3px;}
  .weight-bar{height:8px; border-radius:5px; background:rgba(255,255,255,0.08); margin-top:14px; overflow:hidden;}
  .weight-bar-fill{height:100%; border-radius:5px; background:linear-gradient(90deg, var(--push), var(--gold)); box-shadow:0 0 10px rgba(242,183,5,0.5); transition:width .3s ease;}
  .weight-meta-row{display:flex; justify-content:space-between; gap:8px; margin-top:10px; font-size:11px; color:var(--muted); font-family:'JetBrains Mono',monospace;}
  .weight-meta-row b{color:var(--ink); font-family:'Inter',sans-serif; font-weight:800;}
  .weight-log-row{display:flex; gap:8px; margin-top:14px;}
  .weight-log-row input{flex:1; background:var(--bg-2); border:1.5px solid var(--line); border-radius:8px; color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:13px; padding:9px 10px;}
  .weight-log-row input::placeholder{color:#5A5964;}
  .weight-log-row input:focus{outline:none; border-color:var(--gold);}
  .weight-log-row button{background:var(--gold); border:none; color:#0A0A0C; font-weight:800; font-size:12px; padding:0 18px; border-radius:8px; cursor:pointer; text-transform:uppercase; letter-spacing:0.3px; font-family:'Teko',sans-serif;}
  .weight-history{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); display:flex; flex-direction:column; gap:6px;}
  .weight-history-row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); font-family:'JetBrains Mono',monospace;}
  .weight-history-row span:last-child{color:var(--ink); font-weight:700;}

  .diet-card{background:var(--card); border:1.5px solid var(--gold-dim); border-radius:16px; padding:18px 18px 16px; margin-bottom:18px;}
  .diet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .diet-sub{font-size:11px; color:var(--muted); font-weight:600; margin-top:4px; line-height:1.4; max-width:320px;}
  .diet-macros{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:14px;}
  .macro-pill{background:var(--bg-2); border:1px solid var(--line); border-radius:10px; padding:9px 4px; text-align:center;}
  .macro-val{display:block; font-family:'Bungee',sans-serif; font-size:14px; color:var(--gold); line-height:1.2;}
  .macro-lbl{display:block; font-size:8.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--muted); font-weight:700; margin-top:2px;}
  .diet-note{font-size:11px; color:var(--muted); line-height:1.55; margin-top:12px;}
  .diet-meals{margin-top:6px; display:flex; flex-direction:column; gap:10px;}
  .meal-row{background:var(--bg-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .meal-name{font-family:'Teko',sans-serif; font-size:14px; letter-spacing:0.3px; color:var(--gold); text-transform:uppercase; font-weight:600;}
  .meal-foods{font-size:11.5px; color:var(--ink); line-height:1.5; margin-top:3px;}

  .history-section{margin-top:26px; margin-bottom:10px;}
  .history-section h3{font-family:'Bungee',sans-serif; font-size:16px; letter-spacing:0.3px; color:var(--gold); margin-bottom:12px;}
  .heatmap-sub{font-size:10.5px; color:var(--muted); margin:-8px 0 12px; font-family:'JetBrains Mono',monospace;}
  .history-list{display:flex; flex-direction:column; gap:9px;}
  .history-row{background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px;}
  .history-row-top{display:flex; justify-content:space-between; align-items:center; font-size:12px;}
  .history-label{font-weight:700; color:var(--ink); font-family:'Teko',sans-serif; font-size:15px; letter-spacing:0.3px;}
  .history-pct{color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:11px;}
  .history-bar{height:5px; border-radius:3px; background:rgba(255,255,255,0.08); margin-top:7px; overflow:hidden;}
  .history-bar-fill{height:100%; border-radius:3px; background:var(--pull);}
  .chart-empty{font-size:12px; color:var(--muted); text-align:center; padding:20px 10px; font-family:'JetBrains Mono',monospace;}
  .chart-range-row{display:flex; gap:6px; margin:10px 0 6px;}
  .chart-range-pill{font-family:'Teko',sans-serif; font-size:12px; letter-spacing:0.3px; padding:5px 12px; border-radius:20px; border:1.5px solid var(--line); color:var(--muted); background:transparent; cursor:pointer;}
  .chart-range-pill.active{border-color:var(--gold); color:var(--gold); background:var(--gold-dim);}
  .history-empty{color:var(--muted); font-size:12.5px; text-align:center; padding:14px 0; font-style:italic;}

  .reset-btn{width:100%; margin-top:18px; background:var(--card); border:1.5px solid var(--line); color:var(--muted); font-size:12.5px; font-weight:700; padding:12px; border-radius:12px; cursor:pointer; letter-spacing:0.3px; transition:border-color .15s ease, color .15s ease; font-family:'Teko',sans-serif; text-transform:uppercase;}
  .reset-btn:active{border-color:var(--bad); color:var(--bad);}

  .save-entry-btn{width:100%; margin-bottom:10px; background:var(--gold); border:none; color:#0A0A0C; font-size:14px; font-weight:800; padding:13px; border-radius:12px; cursor:pointer; letter-spacing:0.4px; text-transform:uppercase; font-family:'Teko',sans-serif; box-shadow:0 0 16px rgba(242,183,5,0.35); transition:opacity .15s ease;}
  .save-entry-btn:disabled{opacity:0.6; cursor:default;}
  .save-entry-btn:active{transform:scale(0.99);}

  .save-status{text-align:center; font-size:11px; font-weight:700; margin-bottom:16px; min-height:14px; font-family:'JetBrains Mono',monospace; letter-spacing:0.2px;}
  .save-status.ok{color:var(--good);}
  .save-status.err{color:var(--bad);}

  /* Persistent top bar -- shared by both dashboard pages, so account/theme/
     sign-out and save status stay reachable regardless of which page you're
     on (a save can happen from either page, so its status shouldn't only be
     visible on one of them). */
  .app-topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .app-topbar .hero-nav-group{display:flex; gap:8px;}
  .save-pill{display:flex; align-items:center; gap:5px; border-radius:20px; padding:4px 10px 4px 8px; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.3px; border:1px solid var(--line); background:var(--card); color:var(--muted); transition:border-color 0.2s, color 0.2s;}
  .save-pill .save-dot{width:6px; height:6px; border-radius:50%; background:var(--muted); flex-shrink:0;}
  .save-pill.saving .save-dot{background:var(--gold); animation:save-pulse 1s ease-in-out infinite;}
  .save-pill.saving{border-color:var(--gold-dim); color:var(--gold);}
  .save-pill.ok .save-dot{background:var(--good);}
  .save-pill.ok{border-color:var(--good); color:var(--good); background:rgba(31,174,75,0.1);}
  .save-pill.err .save-dot{background:var(--bad);}
  .save-pill.err{border-color:var(--bad); color:var(--bad); background:rgba(214,35,79,0.1);}
  @keyframes save-pulse{0%,100%{opacity:1;} 50%{opacity:0.3;}}

  /* Bottom tab bar -- switches between the Overview and Workout pages */
  .bottom-tabs{display:flex; gap:8px; margin:18px 0 6px; background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:6px;}
  .coach-fab{
    position:fixed; right:20px; bottom:88px; z-index:40;
    width:54px; height:54px; border-radius:50%; border:none;
    background:var(--gold); color:#161616; font-size:22px;
    box-shadow:0 4px 14px rgba(0,0,0,0.4); cursor:pointer;
  }
  .coach-fab:active{transform:scale(0.94);}
  .bottom-tab{flex:1;min-width:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 0 7px; border-radius:11px; border:none; background:transparent; font-family:'Teko',sans-serif; font-size:12px; letter-spacing:0.5px; color:var(--muted); cursor:pointer;}
  .bottom-tab .bt-icon{font-size:17px; line-height:1;}
  .bottom-tab.active{background:var(--bg-2); color:var(--gold); box-shadow:inset 0 0 0 1.5px var(--gold-dim);}

  .loading{text-align:center; color:var(--muted); font-size:13px; padding:60px 0;}

  /* --- Auth --- */
  .auth-card{background:var(--card); border:1.5px solid var(--gold-dim); border-radius:16px; padding:26px 22px; margin-top:50px;}
  .auth-card h2{font-family:'Bungee',sans-serif; font-size:22px; color:var(--gold);}
  .auth-card p.sub{color:var(--muted); font-size:12px; margin-top:6px; margin-bottom:18px; line-height:1.5;}
  .auth-field{margin-bottom:13px;}
  .auth-field label{font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); font-weight:700; display:block; margin-bottom:4px;}
  .auth-field input{width:100%; background:var(--bg-2); border:1.5px solid var(--line); border-radius:8px; color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:14px; padding:11px 12px;}
  .auth-field input:focus{outline:none; border-color:var(--gold);}
  .auth-submit{width:100%; background:var(--gold); border:none; color:#0A0A0C; font-weight:800; font-size:14px; padding:13px; border-radius:12px; cursor:pointer; text-transform:uppercase; font-family:'Teko',sans-serif; letter-spacing:0.4px; box-shadow:0 0 16px rgba(242,183,5,0.35); margin-top:6px;}
  .auth-submit:disabled{opacity:0.6; cursor:default;}
  .auth-switch{text-align:center; margin-top:16px; font-size:12px; color:var(--muted);}
  .auth-switch a{color:var(--gold); cursor:pointer; font-weight:700; text-decoration:underline;}

  .info-card{background:var(--card); border:1.5px dashed var(--gold-dim); border-radius:16px; padding:26px 22px; margin-top:50px; text-align:center;}
  .info-card .eyebrow{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .info-card h2{font-family:'Bungee',sans-serif; font-size:22px; margin-top:8px; color:var(--gold);}
  .info-card p{color:var(--muted); font-size:13px; margin-top:10px; line-height:1.6;}
  .info-card button{margin-top:18px;}

  /* --- Questionnaire --- */
  .step-progress{display:flex; gap:5px; margin-top:20px; margin-bottom:6px;}
  .step-progress .seg{flex:1; height:4px; border-radius:3px; background:var(--line);}
  .step-progress .seg.done{background:var(--gold);}
  .q-card{background:var(--card); border:1.5px solid var(--gold-dim); border-radius:16px; padding:22px 20px; margin-top:14px;}
  .q-eyebrow{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700;}
  .q-title{font-family:'Bungee',sans-serif; font-size:19px; color:var(--ink); margin-top:8px; line-height:1.35;}
  .q-options{display:flex; flex-direction:column; gap:9px; margin-top:18px;}
  .q-option{background:var(--bg-2); border:1.5px solid var(--line); border-radius:12px; padding:13px 15px; cursor:pointer; font-family:'Teko',sans-serif; font-size:16px; letter-spacing:0.3px; color:var(--ink); transition:all .15s ease;}
  .q-option.selected{border-color:var(--gold); background:rgba(242,183,5,0.08); box-shadow:0 0 0 1px var(--gold);}
  .q-chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px;}
  .q-chip{background:var(--bg-2); border:1.5px solid var(--line); border-radius:20px; padding:9px 16px; cursor:pointer; font-family:'Teko',sans-serif; font-size:14px; letter-spacing:0.3px; color:var(--ink); transition:all .15s ease;}
  .q-chip.selected{border-color:var(--gold); background:rgba(242,183,5,0.08); color:var(--gold);}
  .q-nav{display:flex; gap:10px; margin-top:22px;}
  .q-chat-entry{text-align:center; margin-top:16px; font-size:12px; color:var(--muted); line-height:1.6;}
  .q-chat-entry a{color:var(--gold); font-weight:700; cursor:pointer; text-decoration:underline;}

  /* ============ chat intake ============ */
  .chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 44px); max-height:720px;}
  .chat-header{display:flex; align-items:center; justify-content:space-between; padding:14px 4px;}
  .chat-header h2{font-family:'Bungee',sans-serif; font-size:18px; color:var(--gold);}
  .chat-header button{background:none; border:1.5px solid var(--line); color:var(--muted); border-radius:20px; padding:6px 14px; font-family:'Teko',sans-serif; font-size:12px; cursor:pointer;}
  .chat-log{flex:1; overflow-y:auto; padding:8px 2px; display:flex; flex-direction:column; gap:10px;}
  .chat-bubble{max-width:82%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.5;}
  .chat-bubble.assistant{align-self:flex-start; background:var(--card); border:1.5px solid var(--line); border-bottom-left-radius:4px;}
  .chat-bubble.user{align-self:flex-end; background:var(--gold-dim); color:var(--ink); border-bottom-right-radius:4px;}
  .chat-heading{display:block; margin:10px 0 4px; text-decoration:underline; text-underline-offset:3px; color:var(--gold); font-weight:800;}
  .chat-bubble .chat-heading:first-child{margin-top:0;}
  .chat-bubble.user .chat-heading{color:var(--ink);}
  .chat-bubble a{color:var(--gold); text-decoration:underline; text-underline-offset:2px; word-break:break-word;}
  .chat-bubble.user a{color:var(--ink); text-decoration-color:var(--ink);}
  .chat-bubble.typing{display:flex; gap:4px; align-items:center; padding:14px;}
  .chat-bubble.typing span{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:chatDot 1.2s infinite;}
  .chat-bubble.typing span:nth-child(2){animation-delay:0.2s;} .chat-bubble.typing span:nth-child(3){animation-delay:0.4s;}
  @keyframes chatDot{0%,60%,100%{opacity:0.3;} 30%{opacity:1;}}
  .chat-error{align-self:center; font-size:12px; color:var(--bad); text-align:center; padding:8px 14px; background:var(--bad-bg); border-radius:12px;}
  .chat-input-row{display:flex; gap:8px; padding:10px 2px 4px; border-top:1.5px solid var(--line);}
  .chat-input-row input{flex:1; padding:11px 14px; border-radius:22px; border:1.5px solid var(--line); background:var(--bg-2); color:var(--ink); font-size:14px;}
  .chat-input-row button{width:44px; height:44px; border-radius:50%; border:none; background:var(--gold); color:#161616; font-size:16px; cursor:pointer; flex-shrink:0;}
  .chat-input-row button:disabled{opacity:0.4;}
  .chat-ready-card{background:var(--card); border:1.5px solid var(--gold); border-radius:14px; padding:16px; margin:0 2px 10px;}
  .chat-ready-card h3{font-family:'Bungee',sans-serif; font-size:15px; color:var(--gold); margin-bottom:8px;}
  .chat-ready-row{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; border-bottom:1px solid var(--line); color:var(--muted);}
  .chat-ready-row b{color:var(--ink); font-weight:700;}
  .chat-ready-card button{width:100%; margin-top:12px; padding:12px; border-radius:12px; border:none; background:var(--gold); color:#161616; font-family:'Teko',sans-serif; font-size:15px; letter-spacing:0.5px; cursor:pointer;}
  .q-nav button{flex:1; padding:12px; border-radius:12px; font-family:'Teko',sans-serif; font-size:14px; text-transform:uppercase; letter-spacing:0.3px; cursor:pointer; border:1.5px solid var(--line); background:var(--bg-2); color:var(--ink);}
  .q-nav button.primary{background:var(--gold); border-color:var(--gold); color:#0A0A0C; font-weight:800;}
  .q-nav button:disabled{opacity:0.4; cursor:default;}
  .q-input-row{margin-top:18px;}
  .q-input-row label{font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); font-weight:700; display:block; margin-bottom:5px;}
  .q-input-row input{width:100%; background:var(--bg-2); border:1.5px solid var(--line); border-radius:10px; color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:16px; padding:12px 14px; margin-bottom:14px;}
  .q-input-row input:focus{outline:none; border-color:var(--gold);}

  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}

  .plan-stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .plan-stat-card{background:var(--card); border:1.5px solid var(--gold-dim); border-radius:14px; padding:13px 14px; display:flex; align-items:center; gap:11px;}
  .plan-stat-icon{width:36px; height:36px; border-radius:10px; background:var(--bg-2); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .plan-stat-icon svg{width:18px; height:18px; stroke:var(--gold);}
  .plan-stat-text{min-width:0;}
  .plan-stat-label{font-size:9px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); font-weight:700; display:block;}
  .plan-stat-value{font-family:'Teko',sans-serif; font-size:15px; font-weight:700; color:var(--ink); letter-spacing:0.2px; line-height:1.2; margin-top:2px; display:block;}

  /* --- Light theme override --- */
  html[data-theme="light"]{
    --bg:#F4F2EA; --bg-2:#EAE7DA; --card:#FFFFFF; --line:#DDD9C8;
    --ink:#17171B; --muted:#6E6C63; --gold:#A6740A; --gold-dim:#E8D9B0;
    --push:#D6261A; --push-bg:#FFECEA; --push-line:#F3B7AE;
    --pull:#0090AD; --pull-bg:#E6F7FB; --pull-line:#AEE0EC;
    --legs:#8B2FC9; --legs-bg:#F5E9FC; --legs-line:#D9B8EC;
    --good:#1FAE4B; --good-bg:#E4F7EA; --bad:#D6234F; --bad-bg:#FBE4EA;
    --bad-text: #9A1530;
    --heat-3: #E8C468; --heat-2: #F0D89A; --heat-1: #F5E7C9; --heat-0: #EDEAE0;
    --bad-text-sub: #A8455C;
  }
  .ring-track{stroke:var(--line);}
  .ring-fill{stroke:var(--gold);}

  .theme-toggle{width:28px; height:28px; border-radius:8px; border:1.5px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .theme-toggle svg{width:15px; height:15px; stroke:var(--gold);}

  /* --- Account page --- */
  .account-card{background:var(--card); border:1.5px solid var(--gold-dim); border-radius:16px; padding:18px; margin-bottom:16px;}
  .acct-card{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px;}
  .acct-card-title{font-family:'Bungee',sans-serif; font-size:12px; color:var(--gold); letter-spacing:0.3px; margin-bottom:10px;}
  .action-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px;}
  .action-btn{display:flex; flex-direction:row; align-items:center; justify-content:center; gap:6px; padding:9px 8px; border-radius:11px; border:1.5px solid var(--line); background:var(--card); font-family:'Teko',sans-serif; font-size:12px; letter-spacing:0.3px; color:var(--ink); cursor:pointer;}
  .action-btn .ico{font-size:13px;}
  .danger-zone{margin-top:10px; border:1.5px dashed var(--bad); border-radius:12px; padding:9px;}
  .danger-zone-label{font-size:9px; color:var(--bad); text-transform:uppercase; letter-spacing:0.5px; font-family:'JetBrains Mono',monospace; margin-bottom:6px;}
  .danger-btn{width:100%; text-align:left; padding:7px 10px; border-radius:8px; border:1.5px solid var(--bad); background:rgba(214,35,79,0.1); color:var(--bad-text); font-size:11.5px; font-weight:600; margin-bottom:6px; cursor:pointer;}
  .danger-btn:last-child{margin-bottom:0;}
  .danger-btn small{display:block; color:var(--bad-text-sub); font-weight:400; font-size:9.5px; margin-top:1px;}
  .account-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px dashed var(--line); font-size:12.5px; color:var(--muted);}
  .account-row:last-child{border-bottom:none;}
  .account-row b{color:var(--ink); font-weight:800; text-align:right;}
  .account-actions{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .btn-secondary{width:100%; background:var(--bg-2); border:1.5px solid var(--line); color:var(--ink); font-size:13px; font-weight:700; padding:12px; border-radius:12px; cursor:pointer; font-family:'Teko',sans-serif; letter-spacing:0.3px; text-transform:uppercase;}
  .btn-danger{width:100%; background:var(--bad-bg); border:1.5px solid var(--bad); color:var(--bad); font-size:13px; font-weight:700; padding:12px; border-radius:12px; cursor:pointer; font-family:'Teko',sans-serif; letter-spacing:0.3px; text-transform:uppercase;}
  .confirm-box{background:var(--bad-bg); border:1.5px solid var(--bad); border-radius:12px; padding:14px; margin-top:10px; font-size:12.5px; color:var(--ink); line-height:1.6;}
  .confirm-box .row{display:flex; gap:8px; margin-top:10px;}
  .confirm-box button{flex:1; padding:10px; border-radius:10px; font-family:'Teko',sans-serif; font-size:13px; text-transform:uppercase; cursor:pointer; border:1.5px solid var(--line); background:var(--bg-2); color:var(--ink);}
  .confirm-box button.danger{background:var(--bad); border-color:var(--bad); color:#fff; font-weight:800;}

  /* --- Sign-in landing intro (tagline + feature grid) --- */
  .landing-intro{margin-top:34px; margin-bottom:22px; text-align:center;}
  .landing-title{
    font-family:'Bungee',sans-serif; color:var(--on-photo-gold); letter-spacing:1px;
    font-size:clamp(30px, 9vw, 42px); line-height:1; white-space:nowrap;
    text-shadow:3px 3px 0 rgba(0,0,0,0.55), -1px -1px 0 rgba(255,255,255,0.06), 0 0 30px rgba(242,183,5,0.45);
  }
  .landing-tagline{
    font-family:'Bungee',sans-serif; font-size:15px; color:var(--on-photo-gold); margin-top:16px; letter-spacing:0.5px; line-height:1.4;
    -webkit-text-stroke:0.5px rgba(0,0,0,0.4); text-shadow:2.5px 2.5px 0 rgba(0,0,0,0.45);
  }
  .landing-hero-photo{ position:relative; border-radius:18px; overflow:hidden; min-height:200px; margin-bottom:4px; }
  .landing-hero-bg{
    position:absolute; inset:0; background-size:cover; background-position:center;
    filter:grayscale(1) contrast(1.2) brightness(1.15);
    background-image:none;
  }
  .landing-hero-scrim{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.6) 62%, rgba(0,0,0,0.88) 100%);
  }
  .landing-hero-content{
    position:relative; z-index:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; min-height:200px; padding:28px 10px;
  }
  .landing-sub{font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.5; max-width:340px; margin-left:auto; margin-right:auto;}
  .landing-features{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; text-align:left;}
  .landing-feature{background:var(--card); border:1.5px solid var(--gold-dim); border-radius:14px; padding:13px; display:flex; align-items:flex-start; gap:10px; position:relative; overflow:hidden;}
  .landing-feature::before{
    content:''; position:absolute; top:0; right:0; width:0; height:0;
    border-style:solid; border-width:0 26px 26px 0;
    border-color:transparent rgba(255,255,255,0.08) transparent transparent;
    pointer-events:none;
  }
  .landing-feature b{display:block; font-family:'Teko',sans-serif; font-size:14px; color:var(--ink); letter-spacing:0.2px; font-weight:700; position:relative; z-index:1;}
  .landing-feature span{display:block; font-size:10.5px; color:var(--muted); line-height:1.4; margin-top:2px; position:relative; z-index:1;}
  .landing-feature .plan-stat-icon{position:relative; z-index:1;}

  /* --- Show/hide password toggle --- */
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:40px;}
  .pw-toggle{
    position:absolute; right:2px; top:50%; transform:translateY(-50%);
    width:32px; height:32px; border:none; background:none; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;
  }
  .pw-toggle svg{width:16px; height:16px; stroke:var(--muted);}
  .pw-toggle:active svg{stroke:var(--gold);}

  /* --- Accordion toggles (weight history, diet details) --- */
  .accordion-toggle{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
    font-family:'Teko',sans-serif; font-size:13px; font-weight:700; letter-spacing:0.3px;
    color:var(--gold); text-transform:uppercase; cursor:pointer;
  }
  .accordion-toggle svg{width:14px; height:14px; stroke:var(--gold); transition:transform .2s ease;}
  .accordion-toggle.open svg{transform:rotate(180deg);}

  /* --- Swipe chevrons --- */
  .swipe-nav{display:flex; justify-content:space-between; margin-bottom:8px;}
  .swipe-chevron{font-size:11px; color:var(--muted); font-weight:700; cursor:pointer; padding:4px 8px;}
  .swipe-chevron.disabled{opacity:0.3; cursor:default;}

  /* --- Per-exercise edit/delete + manual add form --- */
  .ex-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:10px;}
  .coach-note{margin-top:8px; font-size:12.5px; color:var(--gold); line-height:1.5; font-weight:600;}
  .icon-btn-sm{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--line); background:rgba(127,127,127,0.08); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:border-color .15s ease, transform .15s ease;}
  .icon-btn-sm:active{transform:scale(0.9);}
  .icon-btn-sm svg{width:14px; height:14px; stroke:var(--gold);}
  .icon-btn-sm.danger{border-color:var(--bad); background:var(--bad-bg);}
  .icon-btn-sm.danger svg{stroke:var(--bad);}
  .add-ex-row{margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);}
  .add-ex-row label{font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); font-weight:700; display:block; margin-bottom:6px; margin-top:12px;}
  .add-ex-row label:first-child{margin-top:0;}
  .add-ex-row input, .add-ex-row select{width:100%; background:var(--bg-2); border:1.5px solid var(--line); border-radius:8px; color:var(--ink); font-family:'Inter',sans-serif; font-size:13px; padding:9px 10px;}
  .add-ex-row input:focus, .add-ex-row select:focus{outline:none; border-color:var(--gold);}
  .add-ex-row .row2{display:flex; gap:10px;}
  .add-ex-row .row2 > div{flex:1; min-width:0;}

  /* --- Hero header (new school) --- */
  .hero-header{
    position:relative; z-index:0; overflow:hidden; border-radius:20px; border:1.5px solid var(--gold-dim);
    background:linear-gradient(135deg, var(--push-bg) 0%, var(--card) 38%, var(--card) 62%, var(--pull-bg) 100%);
    padding:14px 16px 20px; margin-bottom:18px;
  }
  .hero-header > .hero-header-bg{
    position:absolute; inset:0; z-index:0;
    background-size:cover; background-position:center;
    filter:grayscale(1) contrast(1.1) brightness(1.6);
    background-image:url('https://images.pexels.com/photos/4753885/pexels-photo-4753885.jpeg?auto=compress&w=800');
  }
  .hero-header > .hero-header-bg::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.45) 50%, rgba(0,0,0,0.7) 100%);
  }
  .hero-header::after{
    content:''; position:absolute; top:-50%; right:6%; width:120px; height:220%;
    background:linear-gradient(180deg, var(--gold), transparent 70%);
    opacity:0.10; transform:rotate(18deg); pointer-events:none;
  }
  .hero-nav{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; position:relative; z-index:1;}
  .hero-nav-group{display:flex; gap:8px;}
  .icon-btn{
    width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line); background:rgba(127,127,127,0.08);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition:border-color .15s ease, transform .15s ease;
  }
  .icon-btn:active{transform:scale(0.9);}
  .icon-btn svg{width:16px; height:16px; stroke:var(--on-photo-gold);}
  .hero-main{display:flex; align-items:center; justify-content:space-between; gap:14px; position:relative; z-index:1;}
  .hero-logo{
    font-family:'Bungee',sans-serif; font-size:29px; letter-spacing:0.5px; line-height:0.92; color:var(--on-photo-gold);
    text-shadow:3px 3px 0 rgba(0,0,0,0.55), 0 0 26px rgba(242,183,5,0.4);
  }
  .hero-badge{
    display:inline-flex; align-items:center; gap:7px; margin-top:9px;
    background:var(--bg-2); border:1.5px solid var(--line); border-radius:20px;
    padding:5px 13px 5px 10px; font-family:'Teko',sans-serif; font-size:13px; letter-spacing:0.3px;
    color:var(--ink); font-weight:600; white-space:nowrap;
  }
  .hero-badge .dot{width:6px; height:6px; border-radius:50%; background:var(--gold); box-shadow:0 0 6px var(--gold); flex-shrink:0;}
  .streak-pill{
    display:inline-flex; align-items:center; margin-top:6px;
    background:var(--bg-2); border:1.5px solid var(--line); border-radius:20px;
    padding:4px 12px; font-family:'Teko',sans-serif; font-size:12px; letter-spacing:0.3px;
    color:var(--ink); font-weight:600; white-space:nowrap;
  }
  .hero-ring-wrap{position:relative; width:82px; height:82px; flex-shrink:0;}
  .hero-ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .hero-pct{font-family:'Bungee',sans-serif; font-size:18px; color:var(--on-photo-heading); line-height:1;}
  .hero-pct-sub{font-family:'JetBrains Mono',monospace; font-size:7px; letter-spacing:0.5px; text-transform:uppercase; color:var(--on-photo-muted); margin-top:3px;}

  html[data-avatar-theme="female"][data-theme="light"]{
    --bg:#FFF7FA; --bg-2:#F9EAF1; --card:#FFFFFF; --line:#E8D5DF; --ink:#25131D; --muted:#806873;
    --gold:#D92C78; --gold-dim:#F2C5D9; --push:#DB3B6A; --push-bg:#FFF0F5; --push-line:#F2B6CB;
    --pull:#7755C7; --pull-bg:#F3EEFF; --pull-line:#D9CDF7; --legs:#C33A9C; --legs-bg:#FFF0FA; --legs-line:#F1C5E2;
  }
  html[data-avatar-theme="male"][data-theme="light"]{
    --bg:#F7F4EA; --bg-2:#EEE9D9; --card:#FFFFFF; --line:#DED7BE; --ink:#1A1812; --muted:#716B5B;
    --gold:#A87300; --gold-dim:#E8D6A5;
  }
  body{
    background-image:radial-gradient(circle at 25% 10%,var(--persona-accent-soft),transparent 30%),repeating-radial-gradient(circle at 15% 20%,rgba(255,255,255,.025) 0 1px,transparent 1px 5px);
  }
  .page-bg{display:none;}
  .wrap{max-width:720px;}
  .landing-hero-photo{min-height:150px;background:linear-gradient(155deg,#050506,#121216 72%);border:1px solid var(--gold-dim);}
  .landing-hero-bg{display:none;}
  .landing-hero-scrim{background:repeating-linear-gradient(135deg,transparent 0 13px,rgba(255,255,255,.025) 13px 14px);}
  .landing-hero-content{min-height:150px;}
  .landing-title{font-family:'Teko',sans-serif;font-style:italic;font-weight:700;font-size:clamp(44px,12vw,64px);transform:skew(-5deg);}
  .landing-tagline{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#fff;}
  .hero-header{min-height:230px;padding-bottom:18px;background:#0b0b0d;border-color:var(--gold);box-shadow:0 12px 40px rgba(0,0,0,.24);}
  .hero-header > .hero-header-bg{background-image:var(--manga-hero)!important;background-position:right center;filter:none;opacity:.95;}
  .hero-header > .hero-header-bg::after{background:linear-gradient(90deg,rgba(4,4,5,.97) 0%,rgba(4,4,5,.78) 42%,rgba(4,4,5,.18) 74%,rgba(4,4,5,.18) 100%);}
  .hero-main{min-height:165px;align-items:flex-end;}
  .hero-logo{font-family:'Teko',sans-serif;font-style:italic;font-size:42px;line-height:.75;transform:skew(-5deg);}
  .hero-badge,.streak-pill{background:rgba(8,8,10,.78);backdrop-filter:blur(4px);}
  .hero-ring-wrap{align-self:flex-start;margin-top:8px;}
  .manga-level-card{border:1.5px solid var(--gold);background:linear-gradient(145deg,var(--card),var(--bg-2));border-radius:16px;padding:14px;margin-bottom:14px;position:relative;overflow:hidden;}
  .manga-level-card:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(145deg,transparent 0 15px,var(--persona-accent-soft) 15px 16px);pointer-events:none;}
  .manga-level-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;position:relative;}
  .manga-level-num{font-family:'Teko',sans-serif;font-size:34px;font-weight:700;line-height:.9;color:var(--gold);}
  .manga-rank{font-family:'Bungee',sans-serif;font-size:11px;color:var(--ink);}
  .manga-xp{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);}
  .manga-xpbar{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:10px;position:relative;}
  .manga-xpfill{height:100%;background:linear-gradient(90deg,var(--gold),#fff2a8);box-shadow:0 0 12px var(--gold);}
  html[data-avatar-theme="female"] .manga-xpfill{background:linear-gradient(90deg,var(--gold),#ffb9dc);}
  .arc-card{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px;overflow:hidden;position:relative;}
  .arc-card:after{content:'';position:absolute;right:-35px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--persona-accent-soft);filter:blur(1px);}
  .arc-kicker{font:700 9px 'JetBrains Mono',monospace;letter-spacing:1.2px;color:var(--gold);text-transform:uppercase;}
  .arc-title{font:700 24px 'Teko',sans-serif;letter-spacing:.4px;margin-top:2px;color:var(--ink);text-transform:uppercase;}
  .arc-quote{font-size:11.5px;color:var(--muted);font-style:italic;max-width:80%;}
  .arc-track{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px;position:relative;z-index:1;}
  .arc-node{border:1px solid var(--line);border-radius:9px;padding:7px 2px;text-align:center;font:700 9px 'JetBrains Mono',monospace;color:var(--muted);background:var(--bg-2);}
  .arc-node.done{border-color:var(--gold);color:var(--gold);}
  .arc-node.active{background:var(--gold);color:#111;border-color:var(--gold);box-shadow:0 0 16px var(--persona-accent-soft);}
  .sport-quest{border:1.5px solid var(--line);background:linear-gradient(135deg,var(--card),var(--persona-accent-soft));border-radius:16px;padding:14px;margin-bottom:14px;}
  .sport-quest h3{font:700 20px 'Teko',sans-serif;color:var(--gold);text-transform:uppercase;}
  .sport-quest p{font-size:11.5px;color:var(--muted);line-height:1.5;}
  .sport-quest button{margin-top:10px;width:100%;border:0;border-radius:10px;padding:10px;background:var(--gold);color:#111;font:700 13px 'Teko',sans-serif;text-transform:uppercase;cursor:pointer;}
  .bottom-tabs{position:sticky;bottom:8px;z-index:30;box-shadow:0 8px 28px rgba(0,0,0,.28);backdrop-filter:blur(10px);}
  .bottom-tab{min-width:0;font-size:9px!important;padding:8px 2px!important;}
  .bottom-tab .bt-icon{font-size:15px;display:block;}
  .coach-fab{background:var(--gold);font-size:0;}
  .coach-fab:after{content:'師';font:700 22px 'Teko',sans-serif;color:#111;}
  .sensei-hero{border:1.5px solid var(--gold);border-radius:18px;min-height:170px;margin:0 0 12px;position:relative;overflow:hidden;background:#09090b;}
  .sensei-hero:before{content:'';position:absolute;inset:0;background-image:var(--manga-hero);background-size:cover;background-position:right center;opacity:.9;}
  .sensei-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.96),rgba(0,0,0,.5) 58%,rgba(0,0,0,.1));}
  .sensei-copy{position:relative;z-index:2;padding:18px;max-width:62%;}
  .sensei-copy h2{font:700 38px 'Teko',sans-serif;font-style:italic;color:var(--gold);line-height:.9;}
  .sensei-copy p{font-size:10px;color:#eee;letter-spacing:1px;text-transform:uppercase;margin-top:8px;}
  .sensei-quick{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;}
  .sensei-quick button{white-space:nowrap;border:1px solid var(--gold-dim);border-radius:99px;background:var(--card);color:var(--ink);padding:8px 11px;font-size:10.5px;cursor:pointer;}
  .chat-wrap{max-width:620px;margin:0 auto;}
  .chat-header h2{font-family:'Teko',sans-serif!important;font-style:italic;font-size:32px!important;color:var(--gold)!important;}
  .chat-bubble.assistant{border-left:3px solid var(--gold);}
  .coach-note{margin-top:8px;font-size:12.5px;color:var(--gold);line-height:1.5;font-weight:600;background:transparent!important;border:0!important;padding:0!important;border-radius:0!important;}
  .manga-page-title{font:700 32px 'Teko',sans-serif;font-style:italic;color:var(--gold);text-transform:uppercase;margin:2px 0 12px;}
  .chapter-list{display:flex;flex-direction:column;gap:9px;}
  .chapter-row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:9px;}
  .chapter-row.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .chapter-num{font:700 24px 'Teko',sans-serif;color:var(--gold);text-align:center;}
  .chapter-row b{font:700 16px 'Teko',sans-serif;text-transform:uppercase;}
  .chapter-row span{font-size:10px;color:var(--muted);}
  .chapter-state{font:700 9px 'JetBrains Mono',monospace;color:var(--gold);}
  .boss-card{margin-top:14px;background:linear-gradient(145deg,#24060d,#08080a);border:1.5px solid #ff304f;border-radius:16px;padding:16px;color:#fff;position:relative;overflow:hidden;}
  .boss-card h3{font:700 30px 'Teko',sans-serif;color:#ff304f;font-style:italic;}
  .boss-card p{font-size:11px;color:#ddd;line-height:1.5;}
  .body-evolution{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
  .evo-stage{text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px 4px;background:var(--bg-2);}
  .evo-figure{height:56px;margin:auto;width:24px;border-radius:45% 45% 35% 35%;background:var(--gold);opacity:.25;position:relative;}
  .evo-stage.active .evo-figure{opacity:1;box-shadow:0 0 18px var(--persona-accent-soft);transform:scale(1.08);}
  .evo-stage span{display:block;font:700 8px 'JetBrains Mono',monospace;color:var(--muted);margin-top:6px;}
  html[data-theme="light"] .hero-header{box-shadow:0 12px 35px rgba(62,45,15,.12);}
  html[data-theme="light"] .coach-fab{box-shadow:0 5px 18px var(--persona-accent-soft);}



  /* ============================== DEPLOYABLE AUTH REDESIGN ============================== */

  .auth-manga-brand{position:relative; overflow:hidden; background:#08080a; border:1px solid #3d310b; border-radius:22px; padding:28px 22px 22px; margin-bottom:16px; box-shadow:0 18px 50px rgba(0,0,0,.32), inset 0 0 0 1px rgba(242,183,5,.035);}
  .auth-manga-brand:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 76% 18%,rgba(242,183,5,.12),transparent 31%),repeating-linear-gradient(142deg,transparent 0 19px,rgba(242,183,5,.028) 19px 20px);pointer-events:none;}
  .auth-manga-brand:after{content:'進';position:absolute;right:-4px;top:-20px;font:700 150px/1 'Teko',sans-serif;color:rgba(242,183,5,.045);transform:rotate(-8deg);pointer-events:none;}
  .auth-brand-inner{position:relative;z-index:1;text-align:center;}
  .auth-brush-logo{font:700 54px/.82 'Teko',sans-serif;font-style:italic;letter-spacing:-1.8px;color:#f2b705;text-transform:uppercase;text-shadow:3px 3px 0 rgba(0,0,0,.9);transform:skew(-4deg);margin:2px 0 12px;}
  .auth-brush-logo span{display:block;}
  .auth-mantra{font:700 10px/1.4 'JetBrains Mono',monospace;letter-spacing:3px;color:#f5f3ec;text-transform:uppercase;opacity:.9;}
  .auth-gold-rule{height:2px;width:82px;background:linear-gradient(90deg,transparent,#f2b705,transparent);margin:18px auto 14px;box-shadow:0 0 12px rgba(242,183,5,.35);}
  .auth-promise{font:500 12px/1.5 'Inter',sans-serif;color:#bdb8ae;max-width:330px;margin:0 auto;}
  .auth-benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:19px;}
  .auth-benefit{padding:9px 5px;border-top:1px solid rgba(242,183,5,.35);color:#f2b705;text-align:center;}
  .auth-benefit b{display:block;font:700 18px/1 'Teko',sans-serif;margin-bottom:4px;}
  .auth-benefit span{display:block;font:700 8px/1.25 'JetBrains Mono',monospace;color:#a8a39a;text-transform:uppercase;letter-spacing:.2px;}
  .auth-manga-card{background:#101014!important;border:1px solid #40340d!important;border-radius:20px!important;box-shadow:0 16px 50px rgba(0,0,0,.28);padding:22px!important;color:#f5f3ec;}
  .auth-manga-card h2{font:700 31px/1 'Teko',sans-serif!important;color:#f2b705!important;letter-spacing:.6px;text-transform:uppercase;margin-bottom:5px!important;}
  .auth-manga-card .sub{color:#aaa59d!important;font-size:12px!important;margin-bottom:20px!important;}
  .auth-manga-card .auth-field label{color:#8f8a82!important;font:700 9px/1 'JetBrains Mono',monospace;letter-spacing:1px;text-transform:uppercase;}
  .auth-manga-card input{background:#09090c!important;border:1px solid #34343c!important;color:#fff!important;border-radius:12px!important;box-shadow:none!important;}
  .auth-manga-card input:focus{border-color:#f2b705!important;box-shadow:0 0 0 2px rgba(242,183,5,.12)!important;}
  .auth-manga-card .pw-toggle svg{stroke:#aaa59d!important;}
  .auth-manga-card .auth-submit{background:linear-gradient(90deg,#e1a700,#ffc928)!important;color:#0b0b0d!important;border:none!important;border-radius:12px!important;box-shadow:0 0 22px rgba(242,183,5,.16)!important;font-family:'Teko',sans-serif!important;font-size:18px!important;letter-spacing:1px!important;}
  .auth-manga-card .auth-switch{color:#817d76!important;}
  .auth-manga-card .auth-switch a{color:#f2b705!important;font-weight:800;}
  .auth-footer-quote{text-align:center;margin:16px 12px 0;font:700 9px/1.55 'JetBrains Mono',monospace;color:#7f7a72;letter-spacing:2px;text-transform:uppercase;}
  html[data-theme="light"] .auth-manga-screen{color:#f6f2e8;}
  html[data-theme="light"] .auth-manga-card{background:#101014!important;border-color:#40340d!important;}
  html[data-theme="light"] .auth-manga-card h2{color:#f2b705!important;}
  html[data-theme="light"] .auth-manga-card .sub{color:#aaa59d!important;}
  html[data-theme="light"] .auth-manga-card input{background:#09090c!important;color:#fff!important;}
  @media(max-width:380px){.auth-brush-logo{font-size:48px}.auth-benefit span{font-size:7px}.auth-manga-brand{padding-left:16px;padding-right:16px}}

<style id="gm-mockup-match">
/* GRIND MODE — mockup-matched responsive shell */
:root{--gm-bg:#05080a;--gm-panel:#0b1014;--gm-line:#263039;--gm-gold:#ffc326;--gm-text:#f5f6f7;--gm-muted:#98a1aa}
body{background:radial-gradient(circle at 70% -10%,rgba(255,195,38,.08),transparent 35%),#05080a!important}
.gm-desktop-shell{min-height:100vh}.gm-sidebar{display:none}.gm-main{min-width:0}
@media(min-width:900px){
 body{overflow-x:hidden}.gm-desktop-shell{display:grid;grid-template-columns:178px minmax(0,1fr);max-width:1440px;margin:auto;background:#05080a;box-shadow:0 0 80px #000}
 .gm-sidebar{display:flex;position:sticky;top:0;height:100vh;flex-direction:column;padding:24px 14px 18px;border-right:1px solid #263039;background:linear-gradient(180deg,#05080a,#080b0e 65%,#05080a);z-index:50;overflow:hidden}
 .gm-brand{font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;font-style:italic;font-size:38px;line-height:.82;color:var(--gold);letter-spacing:-1px;text-shadow:2px 2px #000}.gm-brand-sub{font-size:11px;letter-spacing:2.2px;font-weight:900;margin:12px 0 22px;color:#fff}
 .gm-side-btn{appearance:none;border:0;background:transparent;color:#c8cdd2;padding:11px 12px;border-radius:7px;text-align:left;font:700 13px system-ui;display:flex;gap:11px;align-items:center;cursor:pointer}.gm-side-btn:hover,.gm-side-btn.active{background:var(--gold);color:#090b0d}.gm-side-btn span{width:18px;text-align:center;font-size:16px}.gm-side-spacer{flex:1}
 .gm-side-art{height:230px;margin:10px -14px 15px;background-image:linear-gradient(180deg,transparent,#05080a 92%),var(--manga-hero);background-size:cover;background-position:center top;filter:saturate(.9);position:relative}.gm-side-art:after{content:'継続は力';position:absolute;left:18px;bottom:18px;color:var(--gold);font-size:28px;font-weight:900;writing-mode:vertical-rl;letter-spacing:5px;text-shadow:0 2px 8px #000}

<div class="wrap">
  <div class="error-banner" id="errorBanner">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <span class="msg" id="errorMsg"></span>
    <button id="errorDismiss">✕</button>
  </div>
  <div id="appRoot"><div class="loading">Loading…</div></div>
</div>

<script>
/* ============================== THEME (applied immediately, before any network calls) ============================== */
(function(){
  const stored = localStorage.getItem('grindmode-theme');
  if(stored === 'light') document.documentElement.dataset.theme = 'light';
})();
function toggleTheme(){
  const isLight = document.documentElement.dataset.theme === 'light';
  if(isLight){ delete document.documentElement.dataset.theme; localStorage.setItem('grindmode-theme','dark'); }
  else{ document.documentElement.dataset.theme = 'light'; localStorage.setItem('grindmode-theme','light'); }
  render();
}
function themeToggleSvg(){
  const isLight = document.documentElement.dataset.theme === 'light';
  return isLight
    ? `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
}


/* ============================== PERSONA / TRAINING ARC ============================== */
function applyPersonaTheme(forceSex){
  const sex = forceSex || (profile && profile.sex) || 'unspecified';
  const persona = sex === 'female' ? 'female' : 'male';
  document.documentElement.dataset.avatarTheme = persona;
}
document.documentElement.dataset.avatarTheme = 'male';

const MANGA_CHAPTERS = [
  {name:'The Awakening', min:1, quote:'Show up. The story starts here.'},
  {name:'Forging the Body', min:4, quote:'Discipline turns effort into identity.'},
  {name:'Breaking Limits', min:8, quote:'Yesterday\'s ceiling becomes today\'s floor.'},
  {name:'The Grind', min:14, quote:'Consistency survives the days motivation does not.'},
  {name:'Ascension', min:22, quote:'Master the process. Become the result.'},
];
function mangaProgress(){
  let currentDone=0;
  if(plan && Array.isArray(plan.days)) plan.days.forEach(d=>{ currentDone += dayProgress(d.day).done; });
  const historicalDone = (trackerHistory||[]).reduce((n,w)=>n + (Number(w.done)||0),0);
  const completed = historicalDone + currentDone;
  const xp = Math.max(0, completed*110 + (streakWeeks||0)*180 + Math.max(0,(weightLog||[]).length-1)*35);
  const level = Math.max(1, Math.floor(xp/650)+1);
  const into = xp % 650;
  let chapterIndex=0;
  MANGA_CHAPTERS.forEach((c,i)=>{ if(level>=c.min) chapterIndex=i; });
  const chapter=MANGA_CHAPTERS[chapterIndex];
  const rank = level>=22?'Unstoppable':level>=14?'Grinder':level>=8?'Limit Breaker':level>=4?'Disciplined':'Rookie';
  return {xp,level,into,next:650,chapterIndex,chapter,rank,completed};
}
function mangaLevelCardHtml(m){
  return `<div class="manga-level-card">
    <div class="manga-level-top"><div><div class="manga-level-num">LV. ${m.level}</div><div class="manga-rank">${m.rank}</div></div><div class="manga-xp">${m.into} / ${m.next} XP</div></div>
    <div class="manga-xpbar"><div class="manga-xpfill" style="width:${Math.round(m.into/m.next*100)}%"></div></div>
  </div>`;
}
function mangaArcCardHtml(m){
  return `<div class="arc-card"><div class="arc-kicker">Current Training Arc · Chapter ${String(m.chapterIndex+1).padStart(2,'0')}</div><div class="arc-title">${m.chapter.name}</div><div class="arc-quote">“${m.chapter.quote}”</div><div class="arc-track">${MANGA_CHAPTERS.map((c,i)=>`<div class="arc-node ${i<m.chapterIndex?'done':i===m.chapterIndex?'active':''}">${i+1}</div>`).join('')}</div></div>`;
}
function sportQuestHtml(){
  if(!profile || !profile.sport) return '';
  return `<div class="sport-quest"><div class="arc-kicker">Sport Quest</div><h3>${escapeHtml(profile.sport)}</h3><p>Your strength plan and recovery context are available to Sensei so sport-specific drills can be added without losing the rest of your program.</p><button id="sportSenseiBtn">Ask Sensei for ${escapeHtml(profile.sport)} drills</button></div>`;
}
function renderTrainingArcPage(m){
  return `<div class="manga-page-title">Training Arc</div>${mangaLevelCardHtml(m)}<div class="chapter-list">${MANGA_CHAPTERS.map((c,i)=>`<div class="chapter-row ${i===m.chapterIndex?'active':''}"><div class="chapter-num">${String(i+1).padStart(2,'0')}</div><div><b>${c.name}</b><br><span>${c.quote}</span></div><div class="chapter-state">${i<m.chapterIndex?'CLEARED':i===m.chapterIndex?'ACTIVE':'LOCKED'}</div></div>`).join('')}</div><div class="boss-card"><div class="arc-kicker" style="color:#ff899d">Boss Battle</div><h3>${m.level<8?'THE IRON WALL':m.level<14?'THE GRIND':'THE FINAL REP'}</h3><p>Boss Battles are milestone workouts: complete every prescribed set on your next full-clear day to earn bonus XP and advance the arc.</p></div>`;
}
function renderSportsPage(m){
  const sport = (profile && profile.sport) ? profile.sport : '';
  if(!sport) return `<div class="manga-page-title">Sports</div><div class="sport-quest"><div class="arc-kicker">Sport Training</div><h3>ADD YOUR SPORT</h3><p>Add basketball, soccer, tennis, running, or another sport by editing your plan. Sensei will use it when suggesting drills, conditioning, and recovery.</p><button id="sportsEditPlanBtn">Add a sport</button></div>${mangaLevelCardHtml(m)}`;
  return `<div class="manga-page-title">Sports</div><div class="sport-quest sports-feature"><div class="arc-kicker">Current Sport</div><h3>${escapeHtml(sport)}</h3><p>Strength work, recovery, and your recent completion history stay connected to your sport goal so Sensei can recommend drills without replacing your main program.</p><button id="sportSenseiBtn">Ask Sensei for ${escapeHtml(sport)} drills</button></div>${mangaLevelCardHtml(m)}<div class="arc-card"><div class="arc-kicker">Sport Quest</div><div class="arc-title">Skill + Strength</div><div class="arc-quote">“Different game. Same discipline.”</div><div class="plan-stats-grid" style="margin-top:12px;margin-bottom:0"><div class="plan-stat-card"><div class="plan-stat-text"><span class="plan-stat-label">Training streak</span><span class="plan-stat-value">${streakWeeks} weeks</span></div></div><div class="plan-stat-card"><div class="plan-stat-text"><span class="plan-stat-label">Workouts cleared</span><span class="plan-stat-value">${m.completed}</span></div></div></div></div>`;
}

function renderProgressPage(m, cw, startWeight, goalWeight){
  return `<div class="manga-page-title">Progress</div>${mangaLevelCardHtml(m)}<div class="weight-card"><div class="weight-head"><div><div class="weight-label-sm">Current Weight</div><div class="weight-current">${cw}<span class="weight-unit">lbs</span></div></div><div class="weight-goal-chip">Goal ${goalWeight} lbs</div></div>${renderWeightTrendSvg(weightLog, goalWeight)}</div><div class="arc-card"><div class="arc-kicker">Body Evolution</div><div class="arc-title">Visual Leveling</div><div class="body-evolution">${['Month 1','Month 3','Month 6','Month 12'].map((x,i)=>`<div class="evo-stage ${m.level >= [1,4,8,14][i]?'active':''}"><div class="evo-figure"></div><span>${x}</span></div>`).join('')}</div></div>`;
}
function renderMorePage(m, macros){
  return `<div class="manga-page-title">More</div>${sportQuestHtml()}<div class="diet-card"><div class="weight-label-sm">Nutrition Snapshot</div><div class="diet-macros"><div class="macro-pill"><span class="macro-val">~${macros.calories.toLocaleString()}</span><span class="macro-lbl">kcal</span></div><div class="macro-pill"><span class="macro-val">${macros.protein}g</span><span class="macro-lbl">protein</span></div><div class="macro-pill"><span class="macro-val">${macros.carbs}g</span><span class="macro-lbl">carbs</span></div><div class="macro-pill"><span class="macro-val">${macros.fat}g</span><span class="macro-lbl">fat</span></div></div></div><div class="account-card"><div class="acct-card-title">Recovery</div><div class="account-row"><span>Today</span><b>${todayRecoveryLevel()||'Not logged'}</b></div><div class="account-row"><span>Streak</span><b>${streakWeeks} weeks</b></div><div class="account-row"><span>Character rank</span><b>${m.rank}</b></div><button class="btn-secondary" id="moreAccountBtn" style="margin-top:12px;">Profile & Settings</button></div>`;
}

/* Capture the URL hash BEFORE supabase-js parses/clears it, so we can tell
   whether this page load is the result of a just-clicked confirmation link. */
const arrivedViaEmailConfirm = /type=signup/.test(window.location.hash) || /type=signup/.test(window.location.search);
const arrivedViaPasswordRecovery = /type=recovery/.test(window.location.hash) || /type=recovery/.test(window.location.search);

function showToast(message){
  const el = document.createElement('div');
  el.textContent = message;
  el.style.cssText = 'background:var(--good-bg); border:1.5px solid var(--good); color:var(--ink); border-radius:10px; padding:11px 14px; margin-bottom:14px; font-size:13px; font-weight:600;';
  root().prepend(el);
  setTimeout(()=>{ el.remove(); }, 4000);
}

// Same mechanism as showToast, deliberately styled differently (gold, not
// green) -- this is telling the person something different from "here's
// your normal week-over-week progress," and looking identical to that would
// bury the actual reason (recovery, not just completion) in a message that
// reads like routine progress.
function showRecoveryToast(message){
  const el = document.createElement('div');
  el.textContent = message;
  el.style.cssText = 'background:#241a05; border:1.5px solid var(--gold); color:var(--ink); border-radius:10px; padding:11px 14px; margin-bottom:14px; font-size:13px; font-weight:600; line-height:1.5;';
  root().prepend(el);
  setTimeout(()=>{ el.remove(); }, 5000);
}

/* ============================== MANGA IMPACT BURST ============================== */
const DAY_COMPLETE_PHRASES = ['WORKOUT COMPLETE!', 'DAY CRUSHED!', 'FULL CLEAR!', 'LIMIT BROKEN!', 'BOSS CLEARED!'];
const WEEK_COMPLETE_PHRASES = ['CHAPTER CLEARED!', 'WEEK CONQUERED!', 'PERFECT WEEK!'];
function showMangaBurst(text, big){
  const el = document.createElement('div');
  el.className = 'manga-burst' + (big ? ' big' : '');
  el.innerHTML = `<div class="manga-burst-shape"></div><span class="manga-burst-text">${text}</span>`;
  document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 1600);
}

// Builds a labeled password field with a show/hide eye toggle. Used by every
// password input in the app so the behavior and markup stay consistent.
function passwordFieldHtml(label, id, autocomplete){
  return `<label>${label}</label>
    <div class="pw-wrap">
      <input type="password" id="${id}" autocomplete="${autocomplete}">
      <button type="button" class="pw-toggle" title="Show password">${EYE_SVG}</button>
    </div>`;
}
function togglePasswordField(btn){
  const input = btn.closest('.pw-wrap').querySelector('input');
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  btn.innerHTML = isHidden ? EYE_OFF_SVG : EYE_SVG;
  btn.title = isHidden ? 'Hide password' : 'Show password';
}
// Call after rendering any screen containing password fields.
function wirePasswordToggles(){
  document.querySelectorAll('.pw-toggle').forEach(btn=>{ btn.onclick = ()=> togglePasswordField(btn); });
}

function showError(message){
  const banner = document.getElementById('errorBanner');
  document.getElementById('errorMsg').textContent = message;
  banner.classList.add('show');
}
function hideError(){ document.getElementById('errorBanner').classList.remove('show'); }

// supabase-js's functions.invoke() gives a generic "non-2xx status code"
// message by default and doesn't automatically surface the actual JSON body
// an Edge Function returned -- meaning a 404 (not deployed), a 503 (missing
// API key), and a real bug all look identical from the client's point of
// view unless this is unwrapped explicitly. This digs out whatever specific
// message the function actually tried to send back, falling back to the
// generic one only if that's genuinely all there is.
async function describeFunctionError(error){
  try{
    if(error && error.context && typeof error.context.json === 'function'){
      const body = await error.context.json();
      if(body && body.error) return body.error;
    }
  }catch(_e){ /* fall through */ }
  return (error && error.message) || 'Unknown error';
}

// Escapes text for safe insertion as HTML CONTENT (inside a tag, not an
// attribute) -- distinct from escapeAttr, which only handles the narrower
// attribute-value case. Anything a user can type freely (exercise names,
// rep text, email) must go through this before landing in innerHTML.
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Renders coach/chat message text with a small, SAFE set of formatting --
// escaping happens FIRST, and the formatting patterns below only ever wrap
// already-inert, already-escaped text in real tags. Since no unescaped
// input ever reaches innerHTML, this can't reopen the XSS protection above
// no matter what a user or the model's own text happens to contain.
// Deliberately narrow (block headers, inline bold, line breaks) rather than
// a full markdown parser -- that's all coaching responses actually need,
// and a bigger parser is a bigger surface for something to go wrong.
// "## Topic" on its own line becomes a real underlined section header;
// **bold** stays plain inline emphasis -- kept as two distinct patterns
// rather than overloading one, since a whole sentence in header styling
// mid-paragraph reads oddly next to a short, real topic header.
function formatChatMessage(s){
  let safe = escapeHtml(s);
  safe = safe.replace(/^## (.+)$/gm, '<span class="chat-heading">$1</span>');
  safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Links (e.g. web search citations): the URL must start with http:// or
  // https:// or this pattern simply doesn't match at all -- a scheme like
  // javascript: just stays as plain, inert, escaped text instead of ever
  // becoming a real anchor tag, whether it came from a search result or
  // someone typing link-shaped text into the chat themselves.
  safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  safe = safe.replace(/\n/g, '<br>');
  return safe;
}
