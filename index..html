<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRIND MODE — Personalized</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #0A0A0C;
    --bg-2: #131316;
    --card: #1A1A1F;
    --line: #2E2E36;
    --ink: #F5F3EC;
    --muted: #8B8A94;
    --gold: #F2B705;
    --gold-dim: #4A3B0E;
    --push: #FF3B30;
    --push-bg: #2E1210;
    --push-line: #5C2019;
    --pull: #00B4D8;
    --pull-bg: #0E252C;
    --pull-line: #144C5C;
    --legs: #B14EFF;
    --legs-bg: #251230;
    --legs-line: #4A2160;
    --good: #39FF6A;
    --good-bg: #0F2A16;
    --bad: #FF2E63;
    --bad-bg: #2E0F18;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:
      radial-gradient(circle at 10% -5%, rgba(255,59,48,0.14), transparent 40%),
      radial-gradient(circle at 95% 10%, rgba(0,180,216,0.12), transparent 40%),
      radial-gradient(circle at 50% 105%, rgba(177,78,255,0.13), transparent 50%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 2px, transparent 2px, transparent 5px),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  }
  body{padding-bottom:60px;}
  .wrap{max-width:640px; margin:0 auto; padding:22px 16px 0;}

  .error-banner{
    display:none; align-items:center; gap:10px;
    background:var(--bad-bg);
    border:1.5px solid var(--bad); color:#FFB4C6;
    border-radius:10px; padding:11px 14px; margin-bottom:14px; font-size:13px; font-weight:600;
  }
  .error-banner.show{display:flex;}
  .error-banner svg{flex-shrink:0; width:18px; height:18px; stroke:var(--bad);}
  .error-banner .msg{flex:1;}
  .error-banner button{background:none; border:none; color:#FFB4C6; font-size:16px; cursor:pointer; line-height:1; padding:2px 4px;}

  .stats-strip{
    background:var(--card); border:1.5px solid var(--gold-dim); border-radius:12px;
    padding:12px 16px; margin-bottom:16px; display:flex; align-items:center; gap:10px;
    font-size:12px; color:var(--muted); line-height:1.5;
  }
  .stats-strip svg{flex-shrink:0; width:18px; height:18px; stroke:var(--gold); margin-top:1px;}
  .stats-strip b{color:var(--gold); font-weight:700;}

  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:12px;}
  .title-block h1{
    font-family:'Bungee', sans-serif; font-size:26px; letter-spacing:0.5px; line-height:1.05;
    color:var(--gold); text-shadow: 2px 2px 0 rgba(0,0,0,0.6), 0 0 22px rgba(242,183,5,0.35);
  }
  .title-block p{color:var(--muted); font-size:11px; margin-top:6px; letter-spacing:1.2px; font-weight:700; text-transform:uppercase;}

  .ring-wrap{position:relative; width:58px; height:58px; flex-shrink:0;}
  .ring{width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .ring span{font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:700; color:var(--gold);}

  .day-tabs{display:grid; gap:7px; margin-bottom:18px;}
  .day-tab{
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    padding:9px 2px 8px; text-align:center; cursor:pointer; transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    position:relative;
  }
  .day-tab:active{transform:scale(0.94);}
  .day-tab .dnum{font-family:'Teko',sans-serif; font-weight:700; font-size:26px; line-height:0.8; display:block;}
  .day-tab .dsplit{font-size:8.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); display:block; margin-top:4px; font-weight:700;}
  .day-tab.active{border-color:var(--accent); box-shadow:0 0 0 1.5px var(--accent), 0 0 16px -3px var(--accent);}
  .day-tab .dot{position:absolute; top:6px; right:6px; width:6px; height:6px; border-radius:50%; opacity:0; box-shadow:0 0 8px var(--good);}
  .day-tab.complete .dot{opacity:1; background:var(--good);}
  .day-tab .today-flag{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#161616; font-size:7.5px; font-weight:800; letter-spacing:0.5px;
    padding:2px 6px; border-radius:6px; white-space:nowrap; text-transform:uppercase;
  }
  .day-tab[data-split="push"] .dnum{color:var(--push);}
  .day-tab[data-split="pull"] .dnum{color:var(--pull);}
  .day-tab[data-split="legs"] .dnum{color:var(--legs);}

  .day-header{border-radius:16px; padding:20px 20px 18px; margin-bottom:16px; position:relative; overflow:hidden; border:1.5px solid var(--line);}
  .day-header.push{background:linear-gradient(135deg, var(--push-bg), var(--card) 75%); border-color:var(--push-line);}
  .day-header.pull{background:linear-gradient(135deg, var(--pull-bg), var(--card) 75%); border-color:var(--pull-line);}
  .day-header.legs{background:linear-gradient(135deg, var(--legs-bg), var(--card) 75%); border-color:var(--legs-line);}
  .day-header .eyebrow{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:8px;}
  .day-header .eyebrow .today-pill{background:var(--gold); color:#161616; font-size:9px; padding:2px 8px; border-radius:20px; letter-spacing:0.5px; font-weight:800;}
  .day-header h2{font-family:'Bungee',sans-serif; font-size:28px; letter-spacing:0.3px; margin-top:6px; color:var(--ink); text-shadow:2px 2px 0 rgba(0,0,0,0.5);}
  .day-header .tagline{font-family:'Teko',sans-serif; font-weight:600; font-size:17px; letter-spacing:0.5px; margin-top:2px;}
  .day-header.push .tagline{color:var(--push);}
  .day-header.pull .tagline{color:var(--pull);}
  .day-header.legs .tagline{color:var(--legs);}
  .day-header .meta{display:flex; gap:14px; margin-top:9px; font-size:12.5px; color:var(--muted); font-family:'JetBrains Mono',monospace; font-weight:500;}
  .day-header .progress-bar{height:6px; border-radius:4px; background:rgba(255,255,255,0.08); margin-top:14px; overflow:hidden;}
  .day-header .progress-fill{height:100%; border-radius:4px; transition:width .3s ease;}
  .day-header.push .progress-fill{background:linear-gradient(90deg, var(--push), #FF8A5C); box-shadow:0 0 10px var(--push);}
  .day-header.pull .progress-fill{background:linear-gradient(90deg, var(--pull), #7FE3FF); box-shadow:0 0 10px var(--pull);}
  .day-header.legs .progress-fill{background:linear-gradient(90deg, var(--legs), #E0AFFF); box-shadow:0 0 10px var(--legs);}

  .ex-list{display:flex; flex-direction:column; gap:11px;}
  .ex-card{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:14px 15px 14px 0; display:flex; gap:0; align-items:stretch; transition:border-color .15s ease, box-shadow .15s ease;}
  .ex-card.done{border-color:var(--good); box-shadow:0 0 16px -6px rgba(57,255,106,0.35);}
  .rail{width:5px; border-radius:4px; margin:2px 14px 2px 0; flex-shrink:0;}
  .rail.push{background:var(--push); box-shadow:0 0 8px var(--push);}
  .rail.pull{background:var(--pull); box-shadow:0 0 8px var(--pull);}
  .rail.legs{background:var(--legs); box-shadow:0 0 8px var(--legs);}

  .ex-main{flex:1; min-width:0;}
  .ex-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .ex-name{font-size:15px; font-weight:800; line-height:1.25; color:var(--ink);}
  .ex-name.done-text{text-decoration:line-through; color:var(--muted);}
  .ex-tag{font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); font-weight:700; margin-top:2px; display:block;}

  .status-badge{width:27px; height:27px; border-radius:8px; border:2px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s ease; background:var(--bg-2);}
  .status-badge.checked{background:var(--good); border-color:var(--good); box-shadow:0 0 12px rgba(57,255,106,0.55);}
  .status-badge svg{width:15px; height:15px; opacity:0; transition:opacity .1s ease;}
  .status-badge.checked svg{opacity:1;}

  .ex-muscles{font-size:11.5px; line-height:1.5; color:var(--muted); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}
  .ex-muscles b{color:var(--gold); font-weight:700;}

  .ex-inputs{display:flex; gap:8px; margin-top:11px;}
  .ex-inputs .field{flex:1;}
  .ex-inputs label{font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:3px; font-weight:700;}

  .sets-row{display:flex; gap:5px; flex-wrap:wrap;}
  .set-check{width:26px; height:26px; border-radius:7px; border:1.5px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .15s ease; background:var(--bg-2); color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;}
  .set-check.checked{background:var(--good); border-color:var(--good); color:#0A0A0C; box-shadow:0 0 10px rgba(57,255,106,0.45);}
  .set-check svg{width:13px; height:13px;}
  .set-check:active{transform:scale(0.92);}

  .weight-label{width:100%; background:var(--bg-2); border:1.5px solid var(--gold-dim); border-radius:8px; color:var(--gold); font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; padding:7px 8px; display:flex; align-items:baseline; gap:4px;}
  .weight-label .unit{font-size:10px; font-weight:600; color:var(--muted);}

  .week-overview{margin-top:26px; margin-bottom:10px;}
  .week-overview h3{font-family:'Bungee',sans-serif; font-size:16px; letter-spacing:0.3px; color:var(--gold); margin-bottom:12px;}
  .week-grid{display:grid; gap:7px;}
  .week-cell{background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:9px 4px; text-align:center; position:relative;}
  .week-cell.is-today{border-color:var(--gold);}
  .week-cell .wd{font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; font-weight:700;}
  .week-cell .wp{height:5px; border-radius:3px; background:rgba(255,255,255,0.08); margin-top:6px; overflow:hidden;}
  .week-cell .wp-fill{height:100%; border-radius:3px;}

  .weight-card{background:var(--card); border:1.5px solid var(--gold-dim); border-radius:16px; padding:18px 18px 16px; margin-bottom:18px;}
  .weight-head{display:flex; align-items:flex-end; justify-content:space-between; gap:10px;}
  .weight-label-sm{font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px; color:var(--muted); font-weight:700;}
  .weight-current{font-family:'Bungee',sans-serif; font-size:32px; color:var(--gold); line-height:1; margin-top:4px;}
  .weight-current .weight-unit{font-family:'Inter',sans-serif; font-size:13px; color:var(--muted); font-weight:700; margin-left:4px;}
  .weight-goal-chip{background:var(--bg-2); border:1px solid var(--line); border-radius:20px; padding:5px 12px; font-size:11px; font-weight:700; color:var(--ink); white-space:nowrap; font-family:'Teko',sans-serif; letter-spacing:0.3px;}
  .weight-bar{height:8px; border-radius:5px; background:rgba(255,255,255,0.08); margin-top:14px; overflow:hidden;}
  .weight-bar-fill{height:100%; border-radius:5px; background:linear-gradient(90deg, var(--push), var(--gold)); box-shadow:0 0 10px rgba(242,183,5,0.5); transition:width .3s ease;}
  .weight-meta-row{display:flex; justify-content:space-between; gap:8px; margin-top:10px; font-size:11px; color:var(--muted); font-family:'JetBrains Mono',monospace;}
  .weight-meta-row b{color:var(--ink); font-family:'Inter',sans-serif; font-weight:800;}
  .weight-log-row{display:flex; gap:8px; margin-top:14px;}
  .weight-log-row input{flex:1; background:var(--bg-2); border:1.5px solid var(--line); border-radius:8px; color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:13px; padding:9px 10px;}
  .weight-log-row input::placeholder{color:#5A5964;}
  .weight-log-row input:focus{outline:none; border-color:var(--gold);}
  .weight-log-row button{background:var(--gold); border:none; color:#0A0A0C; font-weight:800; font-size:12px; padding:0 18px; border-radius:8px; cursor:pointer; text-transform:uppercase; letter-spacing:0.3px; font-family:'Teko',sans-serif;}
  .weight-history{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); display:flex; flex-direction:column; gap:6px;}
  .weight-history-row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); font-family:'JetBrains Mono',monospace;}
  .weight-history-row span:last-child{color:var(--ink); font-weight:700;}

  .diet-card{background:var(--card); border:1.5px solid var(--gold-dim); border-radius:16px; padding:18px 18px 16px; margin-bottom:18px;}
  .diet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .diet-sub{font-size:11px; color:var(--muted); font-weight:600; margin-top:4px; line-height:1.4; max-width:320px;}
  .diet-macros{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:14px;}
  .macro-pill{background:var(--bg-2); border:1px solid var(--line); border-radius:10px; padding:9px 4px; text-align:center;}
  .macro-val{display:block; font-family:'Bungee',sans-serif; font-size:14px; color:var(--gold); line-height:1.2;}
  .macro-lbl{display:block; font-size:8.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--muted); font-weight:700; margin-top:2px;}
  .diet-note{font-size:11px; color:var(--muted); line-height:1.55; margin-top:12px;}
  .diet-meals{margin-top:6px; display:flex; flex-direction:column; gap:10px;}
  .meal-row{background:var(--bg-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .meal-name{font-family:'Teko',sans-serif; font-size:14px; letter-spacing:0.3px; color:var(--gold); text-transform:uppercase; font-weight:600;}
  .meal-foods{font-size:11.5px; color:var(--ink); line-height:1.5; margin-top:3px;}

  .history-section{margin-top:26px; margin-bottom:10px;}
  .history-section h3{font-family:'Bungee',sans-serif; font-size:16px; letter-spacing:0.3px; color:var(--gold); margin-bottom:12px;}
  .history-list{display:flex; flex-direction:column; gap:9px;}
  .history-row{background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px;}
  .history-row-top{display:flex; justify-content:space-between; align-items:center; font-size:12px;}
  .history-label{font-weight:700; color:var(--ink); font-family:'Teko',sans-serif; font-size:15px; letter-spacing:0.3px;}
  .history-pct{color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:11px;}
  .history-bar{height:5px; border-radius:3px; background:rgba(255,255,255,0.08); margin-top:7px; overflow:hidden;}
  .history-bar-fill{height:100%; border-radius:3px; background:var(--pull);}
  .history-empty{color:var(--muted); font-size:12.5px; text-align:center; padding:14px 0; font-style:italic;}

  .reset-btn{width:100%; margin-top:18px; background:var(--card); border:1.5px solid var(--line); color:var(--muted); font-size:12.5px; font-weight:700; padding:12px; border-radius:12px; cursor:pointer; letter-spacing:0.3px; transition:border-color .15s ease, color .15s ease; font-family:'Teko',sans-serif; text-transform:uppercase;}
  .reset-btn:active{border-color:var(--bad); color:var(--bad);}

  .save-entry-btn{width:100%; margin-bottom:10px; background:var(--gold); border:none; color:#0A0A0C; font-size:14px; font-weight:800; padding:13px; border-radius:12px; cursor:pointer; letter-spacing:0.4px; text-transform:uppercase; font-family:'Teko',sans-serif; box-shadow:0 0 16px rgba(242,183,5,0.35); transition:opacity .15s ease;}
  .save-entry-btn:disabled{opacity:0.6; cursor:default;}
  .save-entry-btn:active{transform:scale(0.99);}

  .save-status{text-align:center; font-size:11px; font-weight:700; margin-bottom:16px; min-height:14px; font-family:'JetBrains Mono',monospace; letter-spacing:0.2px;}
  .save-status.ok{color:var(--good);}
  .save-status.err{color:var(--bad);}

  .loading{text-align:center; color:var(--muted); font-size:13px; padding:60px 0;}

  /* --- Auth --- */
  .auth-card{background:var(--card); border:1.5px solid var(--gold-dim); border-radius:16px; padding:26px 22px; margin-top:50px;}
  .auth-card h2{font-family:'Bungee',sans-serif; font-size:22px; color:var(--gold);}
  .auth-card p.sub{color:var(--muted); font-size:12px; margin-top:6px; margin-bottom:18px; line-height:1.5;}
  .auth-field{margin-bottom:13px;}
  .auth-field label{font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); font-weight:700; display:block; margin-bottom:4px;}
  .auth-field input{width:100%; background:var(--bg-2); border:1.5px solid var(--line); border-radius:8px; color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:14px; padding:11px 12px;}
  .auth-field input:focus{outline:none; border-color:var(--gold);}
  .auth-submit{width:100%; background:var(--gold); border:none; color:#0A0A0C; font-weight:800; font-size:14px; padding:13px; border-radius:12px; cursor:pointer; text-transform:uppercase; font-family:'Teko',sans-serif; letter-spacing:0.4px; box-shadow:0 0 16px rgba(242,183,5,0.35); margin-top:6px;}
  .auth-submit:disabled{opacity:0.6; cursor:default;}
  .auth-switch{text-align:center; margin-top:16px; font-size:12px; color:var(--muted);}
  .auth-switch a{color:var(--gold); cursor:pointer; font-weight:700; text-decoration:underline;}

  .info-card{background:var(--card); border:1.5px dashed var(--gold-dim); border-radius:16px; padding:26px 22px; margin-top:50px; text-align:center;}
  .info-card .eyebrow{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .info-card h2{font-family:'Bungee',sans-serif; font-size:22px; margin-top:8px; color:var(--gold);}
  .info-card p{color:var(--muted); font-size:13px; margin-top:10px; line-height:1.6;}
  .info-card button{margin-top:18px;}

  /* --- Questionnaire --- */
  .step-progress{display:flex; gap:5px; margin-top:20px; margin-bottom:6px;}
  .step-progress .seg{flex:1; height:4px; border-radius:3px; background:var(--line);}
  .step-progress .seg.done{background:var(--gold);}
  .q-card{background:var(--card); border:1.5px solid var(--gold-dim); border-radius:16px; padding:22px 20px; margin-top:14px;}
  .q-eyebrow{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700;}
  .q-title{font-family:'Bungee',sans-serif; font-size:19px; color:var(--ink); margin-top:8px; line-height:1.35;}
  .q-options{display:flex; flex-direction:column; gap:9px; margin-top:18px;}
  .q-option{background:var(--bg-2); border:1.5px solid var(--line); border-radius:12px; padding:13px 15px; cursor:pointer; font-family:'Teko',sans-serif; font-size:16px; letter-spacing:0.3px; color:var(--ink); transition:all .15s ease;}
  .q-option.selected{border-color:var(--gold); background:rgba(242,183,5,0.08); box-shadow:0 0 0 1px var(--gold);}
  .q-chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px;}
  .q-chip{background:var(--bg-2); border:1.5px solid var(--line); border-radius:20px; padding:9px 16px; cursor:pointer; font-family:'Teko',sans-serif; font-size:14px; letter-spacing:0.3px; color:var(--ink); transition:all .15s ease;}
  .q-chip.selected{border-color:var(--gold); background:rgba(242,183,5,0.08); color:var(--gold);}
  .q-nav{display:flex; gap:10px; margin-top:22px;}
  .q-nav button{flex:1; padding:12px; border-radius:12px; font-family:'Teko',sans-serif; font-size:14px; text-transform:uppercase; letter-spacing:0.3px; cursor:pointer; border:1.5px solid var(--line); background:var(--bg-2); color:var(--ink);}
  .q-nav button.primary{background:var(--gold); border-color:var(--gold); color:#0A0A0C; font-weight:800;}
  .q-nav button:disabled{opacity:0.4; cursor:default;}
  .q-input-row{margin-top:18px;}
  .q-input-row label{font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); font-weight:700; display:block; margin-bottom:5px;}
  .q-input-row input{width:100%; background:var(--bg-2); border:1.5px solid var(--line); border-radius:10px; color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:16px; padding:12px 14px; margin-bottom:14px;}

const EXP_MULT = {beginner:0.65, intermediate:1.0, advanced:1.3};
const EXP_CAP = {beginner:5, intermediate:6, advanced:7};
const EQUIP_ALLOWED = {full_gym:['barbell','dumbbell','machine','cable','bodyweight','bench'], home_dumbbells:['dumbbell','bodyweight','bench'], bodyweight:['bodyweight']};
const REP_RANGES = {
  strength: {compound:'4-6', isolation:'6-8'},
  hypertrophy: {compound:'6-10', isolation:'10-12'},
  endurance: {compound:'10-12', isolation:'12-15'},
};
const SET_COUNTS = {
  strength: {compound:5, isolation:3},
  hypertrophy: {compound:4, isolation:3},
  endurance: {compound:3, isolation:3},
};
const GOAL_TO_REPCAT = {strength:'strength', muscle_gain:'hypertrophy', recomp:'hypertrophy', fat_loss:'endurance', general:'endurance'};

function equipmentAllowed(e, tier){ const a = EQUIP_ALLOWED[tier]||[]; return e.equipment.some(eq=>a.includes(eq)); }
function jointOk(e, avoid){ if(!avoid || !avoid.length) return true; return !e.joints.some(j=>avoid.includes(j)); }

function buildPool(profile){
  return EX.filter(e=> equipmentAllowed(e, profile.equipment) && jointOk(e, profile.avoid||[]));
}

function pickExercise(pool, usedIds, muscle, need){
  let cands = pool.filter(e=> e.muscle===muscle && !usedIds.has(e.id) && e.compound===(need==='compound'));
  if(cands.length===0) cands = pool.filter(e=> e.muscle===muscle && !usedIds.has(e.id));
  if(cands.length===0) return null;
  return cands[0];
}

function materialize(e, profile){
  const repCat = GOAL_TO_REPCAT[profile.goal] || 'hypertrophy';
  const reps = REP_RANGES[repCat][e.compound?'compound':'isolation'];
  const sets = SET_COUNTS[repCat][e.compound?'compound':'isolation'];
  let weightDisplay = '—';
  if(e.unit !== 'bodyweight'){
    const mult = EXP_MULT[profile.experience] || 1;
    const bwRatio = e.bwScaled ? (profile.currentWeight / 183) : 1;
    let w = Math.round((e.seed * mult * bwRatio) / 5) * 5;
    w = Math.max(5, w);
    weightDisplay = String(w);
  }
  return {id:e.id, name:e.name, tag:MUSCLE_LABEL[e.muscle]||e.muscle, sets, reps, weight:weightDisplay, unit:e.unit, muscles:e.desc};
}

function buildDay(template, pool, dayNum, profile){
  const usedIds = new Set();
  const picked = [];
  template.targets.forEach(([muscle, need])=>{
    const ex = pickExercise(pool, usedIds, muscle, need);
    if(ex){ usedIds.add(ex.id); picked.push(ex); }
  });
  const cap = EXP_CAP[profile.experience] || 6;
  const finalPicks = picked.slice(0, cap);
  const uniqueTags = [...new Set(finalPicks.map(e=>MUSCLE_LABEL[e.muscle]||e.muscle))];
  return {
    day: dayNum, split: template.accent, title: template.title,
    subtitle: uniqueTags.join(' · '), tagline: template.tagline,
    exercises: finalPicks.map(e=>materialize(e, profile)),
  };
}

function generatePlan(profile){
  const templates = TEMPLATES[profile.days] || TEMPLATES[4];
  const pool = buildPool(profile);
  const days = templates.map((t,i)=>buildDay(t, pool, i+1, profile));
  return {days, generatedAt: new Date().toISOString()};
}

const ACTIVITY_MULT = {sedentary:12.5, light:14, moderate:15.5, very:17};
const GOAL_ADJ = {fat_loss:0.8, muscle_gain:1.1, recomp:0.9, strength:1.0, general:1.0};
const GOAL_LABEL = {fat_loss:'Lose Fat', muscle_gain:'Build Muscle', recomp:'Body Recomposition', strength:'Get Stronger', general:'General Fitness'};
const EQUIP_LABEL = {full_gym:'Full Gym', home_dumbbells:'Home (Dumbbells)', bodyweight:'Bodyweight Only'};

const ACTIVITY_LABEL = {sedentary:'Sedentary', light:'Lightly Active', moderate:'Moderately Active', very:'Very Active'};

function computeMacros(profile){
  const maintenance = profile.currentWeight * (ACTIVITY_MULT[profile.activity]||14.5);
  const targetCals = Math.round(maintenance * (GOAL_ADJ[profile.goal]||1));
  const proteinG = Math.round(profile.currentWeight * 1);
  const fatG = Math.round(profile.currentWeight * 0.35);
  const proteinCals = proteinG*4, fatCals = fatG*9;
  const carbCalsFloor = profile.currentWeight * 4;
  const carbCals = Math.max(targetCals - proteinCals - fatCals, carbCalsFloor);
  const carbG = Math.round(carbCals/4);
  return {calories: Math.round(proteinCals+fatCals+carbCals), protein:proteinG, carbs:carbG, fat:fatG};
}

async function handleSignUp(email, password, confirmPw){
  hideError();
  if(!isValidEmail(email)){ showError('Enter a valid email address.'); return; }
  if(password.length < 6){ showError('Password must be at least 6 characters.'); return; }

  const {data, error} = await sb.auth.signUp({
    email, password,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }

  if(error){ showError(error.message); return; }
  if(data.session){ currentUser = data.session.user; await loadProfileAndData(); return; }
  pendingEmail = email;
  APP_STATE = 'check-email';
  render();
}

async function loadProfileAndData(){
  APP_STATE = 'loading'; render();
  try{
    const {data: profRow, error: profErr} = await sb.from('user_profiles').select('*').eq('id', currentUser.id).maybeSingle();
    if(profErr) throw profErr;
    if(!profRow || !profRow.onboarded){
      profile = profRow || null;
      qAnswers = profRow ? {...profRow} : {};
      qIndex = 0;
      APP_STATE = 'questionnaire';
      render();
      return;
    }
    profile = profRow;
    const {data: dataRow, error: dataErr} = await sb.from('user_data').select('*').eq('id', currentUser.id).maybeSingle();
    if(dataErr) throw dataErr;
    plan = (dataRow && dataRow.plan) ? dataRow.plan : generatePlan(profileToGenInput(profile));
    const tracker = (dataRow && dataRow.tracker) ? dataRow.tracker : {state:{}, history:[], weightLog:[]};
    trackerState = tracker.state || {};
    trackerHistory = tracker.history || [];
    weightLog = tracker.weightLog || [];
    activeDay = getUpNextDay();
    handleWeekRollover();
    APP_STATE = 'dashboard';
    render();
  }catch(e){
    showError('Could not load your data: ' + e.message);
    APP_STATE = 'signin';
    render();
  }
}

let writeLock = Promise.resolve();
function saveUserData(){
  const run = async () => {
    const {error} = await sb.from('user_data').upsert({
      id: currentUser.id,
      plan,
      tracker: {state: trackerState, history: trackerHistory, weightLog},
      updated_at: new Date().toISOString(),
    });
    if(error) throw error;
  };
  const resultPromise = writeLock.then(run, run);
  writeLock = resultPromise.then(()=>{}, ()=>{});
  return resultPromise;
}

async function writeWithRetry(attempts=3){
  let lastErr;
  for(let i=0;i<attempts;i++){
    try{ return await saveUserData(); }
    catch(e){ lastErr=e; await sleep(300*(i+1)); }
  }
  throw lastErr;
}

async function silentSave(){
  try{ await writeWithRetry(3); return true; }
  catch(e){ console.warn('Background save failed', e); return false; }
}

function renderSaveStatus(){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  if(saveStatus==='saving'){ el.textContent='Saving…'; el.className='save-status'; }
  else if(saveStatus==='saved' && lastSavedAt){ el.textContent=`✓ Saved · ${lastSavedAt.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}`; el.className='save-status ok'; }
  else if(saveStatus==='error'){ el.textContent="⚠ Couldn't save your last change — check your connection."; el.className='save-status err'; }
  else{ el.textContent=''; el.className='save-status'; }
}

async function saveAll(){
  saveStatus='saving'; renderSaveStatus();
  try{
    await writeWithRetry(3);
    saveStatus='saved'; lastSavedAt=new Date(); renderSaveStatus();
    return true;
  }catch(e){
    saveStatus='error'; renderSaveStatus();
    return false;
  }
}

// Calls a Supabase Edge Function ("ask-claude") that holds the Anthropic API
// key server-side. Never call api.anthropic.com directly from this file —
// there is no way to keep a key secret in a public GitHub Pages file.
async function callClaude(mode, prompt, context){
  const {data, error} = await sb.functions.invoke('ask-claude', { body: {mode, prompt, context} });
  if(error) throw new Error(error.message || 'Could not reach the AI assistant.');
  if(data && data.error) throw new Error(data.error);
  if(!data || typeof data.text !== 'string') throw new Error('Unexpected response from the AI assistant.');
  return data.text;
}

function stripCodeFences(text){
  return text.replace(/^```[a-z]*\n?/i, '').replace(/```\s*$/,'').trim();
}

/* ============================== QUESTIONNAIRE FLOW ============================== */
function qCanAdvance(){
  const q = QUESTIONS[qIndex];
  if(q.type==='single') return qAnswers[q.key] !== undefined && qAnswers[q.key] !== null;
  if(q.type==='multi') return true;
  if(q.type==='numbers'){
    return q.fields.every(f=>{
      const v = qAnswers[f.key];
      return v !== undefined && v !== '' && !isNaN(v) && v >= f.min && v <= f.max;
    });
  }
  return true;
}

function renderQuestionnaire(){
  const q = QUESTIONS[qIndex];
  const segs = QUESTIONS.map((_,i)=>`<div class="seg ${i<=qIndex?'done':''}"></div>`).join('');
  let body = '';
  if(q.type==='single'){
    body = `<div class="q-options">${q.options.map(o=>`
      <div class="q-option ${qAnswers[q.key]===o.value?'selected':''}" data-val="${o.value}">${o.label}</div>
    `).join('')}</div>`;
  } else if(q.type==='multi'){
    if(!Array.isArray(qAnswers.avoid)) qAnswers.avoid = [];
    body = `<div class="q-chips">${q.options.map(o=>`
      <div class="q-chip ${qAnswers.avoid.includes(o.value)?'selected':''}" data-val="${o.value}">${o.label}</div>
    `).join('')}</div>`;
  } else if(q.type==='numbers'){
    body = `<div class="q-input-row">${q.fields.map(f=>`
      <label>${f.label}</label>
      <input type="text" inputmode="decimal" data-key="${f.key}" value="${qAnswers[f.key]!==undefined?qAnswers[f.key]:''}" placeholder="e.g. ${f.key==='timeframeWeeks'?'12':'180'}">
    `).join('')}</div>`;
  }

  root().innerHTML = `
    <div class="title-block" style="margin-top:24px;"><h1>GRIND<br>MODE</h1><p>Let's build your plan</p></div>
    <div class="step-progress">${segs}</div>
    <div class="q-card">
      <div class="q-eyebrow">Step ${qIndex+1} of ${QUESTIONS.length}</div>
      <div class="q-title">${q.title}</div>
      ${body}
      <div class="q-nav">
        ${qIndex>0 ? `<button id="qBack">Back</button>` : `<button id="qBack" disabled>Back</button>`}
        <button id="qNext" class="primary" ${qCanAdvance()?'':'disabled'}>${qIndex===QUESTIONS.length-1?'Build My Plan':'Next'}</button>
      </div>
    </div>
  `;

  if(q.type==='single'){
    root().querySelectorAll('.q-option').forEach(el=>{
      el.onclick = ()=>{
        const raw = el.dataset.val;
        qAnswers[q.key] = isNaN(raw) ? raw : Number(raw);
        renderQuestionnaire();
      };
    });
  } else if(q.type==='multi'){
    root().querySelectorAll('.q-chip').forEach(el=>{
      el.onclick = ()=>{
        const v = el.dataset.val;
        const idx = qAnswers.avoid.indexOf(v);
        if(idx>=0) qAnswers.avoid.splice(idx,1); else qAnswers.avoid.push(v);
        renderQuestionnaire();
      };
    });
  } else if(q.type==='numbers'){
    root().querySelectorAll('input[data-key]').forEach(el=>{
      el.oninput = ()=>{
        qAnswers[el.dataset.key] = el.value === '' ? '' : parseFloat(el.value);
        document.getElementById('qNext').disabled = !qCanAdvance();
      };
    });
  }

  document.getElementById('qBack').onclick = ()=>{ if(qIndex>0){ qIndex--; renderQuestionnaire(); } };
  document.getElementById('qNext').onclick = async ()=>{
    if(!qCanAdvance()) return;
    if(qIndex < QUESTIONS.length-1){ qIndex++; renderQuestionnaire(); return; }
    await finalizeOnboarding();
  };
}

  hideError();
  const genInput = {

    equipment: qAnswers.equipment, currentWeight: qAnswers.currentWeight, avoid: qAnswers.avoid||[],

  const profileRow = {
    id: currentUser.id, email: currentUser.email,

    current_weight: qAnswers.currentWeight, goal_weight: qAnswers.goalWeight,
    timeframe_weeks: qAnswers.timeframeWeeks, avoid: qAnswers.avoid||[], onboarded: true,
    created_at: new Date().toISOString(),
  };
  try{
    const {data, error} = await sb.from('user_profiles').upsert(profileRow).select().single();
    if(error) throw error;
    profile = data;

    showError('Could not save your plan: ' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Build My Plan'; }
  }
}

  render();
}

/* ============================== TRACKER LOGIC (per-user) ============================== */
function isExerciseDone(ex, s){
  const checks = (s && s.setsChecked) || [];
  if(checks.length !== ex.sets) return false;
  return checks.every(Boolean);
}
function dayProgress(dayNum){
  const d = plan.days.find(x=>x.day===dayNum);
  const total = d.exercises.length;
  const done = d.exercises.filter(ex=>isExerciseDone(ex, trackerState[ex.id])).length;
  return {done, total, pct: total?done/total:0};
}
function getUpNextDay(){
  for(const d of plan.days){ if(dayProgress(d.day).pct < 1) return d.day; }
  return plan.days[0].day;
}
function getWeekId(d){
  const day = d.getDay();
  const diffToMonday = (day+6)%7;
  const monday = new Date(d); monday.setDate(d.getDate()-diffToMonday);
  return `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;
}
function getWeekLabel(weekId){
  const monday = new Date(weekId+'T00:00:00');
  const saturday = new Date(monday); saturday.setDate(monday.getDate()+5);
  return `${monday.toLocaleDateString(undefined,{month:'short',day:'numeric'})}–${saturday.toLocaleDateString(undefined,{day:'numeric'})}`;
}
function computeWeekStats(){
  let totalDone=0, totalEx=0;
  plan.days.forEach(d=>{ const {done,total}=dayProgress(d.day); totalDone+=done; totalEx+=total; });
  return {done:totalDone, total:totalEx};
}
function handleWeekRollover(){
  const todayWeekId = getWeekId(new Date());
  if(!trackerState.__meta){
    trackerState.__meta = {weekId: todayWeekId};
    silentSave();
  } else if(trackerState.__meta.weekId !== todayWeekId){
    const oldWeekId = trackerState.__meta.weekId;
    const stats = computeWeekStats();
    if(stats.total>0){
      trackerHistory.push({weekId: oldWeekId, label:getWeekLabel(oldWeekId), done:stats.done, total:stats.total});
      if(trackerHistory.length>26) trackerHistory = trackerHistory.slice(trackerHistory.length-26);
    }
    trackerState = {__meta:{weekId: todayWeekId}};
    silentSave();
  }
}

function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function formatShortDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function currentWeight(){ return weightLog.length ? weightLog[weightLog.length-1].weight : profile.current_weight; }

async function logWeight(rawValue){
  const val = parseFloat(rawValue);
  if(isNaN(val) || val<70 || val>500){ showError('Enter a valid weight in lbs, e.g. 178'); return; }
  const today = todayISO();
  const idx = weightLog.findIndex(e=>e.date===today);
  if(idx>=0) weightLog[idx].weight = val; else weightLog.push({date:today, weight:val});
  weightLog.sort((a,b)=>a.date.localeCompare(b.date));
  hideError();
  await saveAll();
  renderDashboard();
}

let toggleSaveTimer = null;
function toggleSet(exId, idx, total){
  if(!trackerState[exId]) trackerState[exId] = {};
  if(!Array.isArray(trackerState[exId].setsChecked) || trackerState[exId].setsChecked.length!==total){
    trackerState[exId].setsChecked = new Array(total).fill(false);
  }
  trackerState[exId].setsChecked[idx] = !trackerState[exId].setsChecked[idx];
  renderDashboard();
  clearTimeout(toggleSaveTimer);
  toggleSaveTimer = setTimeout(()=>{ saveAll(); }, 350);
}

        <span><b>${lbsToGo.toFixed(1)}</b> lbs to go</span>

  });

  // day content
  const isUpNext = d.day === upNext;
  const header = `
    <div class="day-header ${d.split}">
      <span class="eyebrow">Day ${d.day} of ${N}${isUpNext ? `<span class="today-pill">Up Next</span>`:''}</span>

      <div class="tagline">${d.tagline}</div>
      <div class="meta"><span>${d.subtitle}</span></div>
      <div class="meta"><span>${done}/${total} exercises logged</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${dayPct*100}%"></div></div>
    </div>`;
  const cards = d.exercises.map(ex=>{
    const s = trackerState[ex.id] || {};
    const setsChecked = (Array.isArray(s.setsChecked) && s.setsChecked.length===ex.sets) ? s.setsChecked : new Array(ex.sets).fill(false);
    const isDone = isExerciseDone(ex, s);
    return `
    <div class="ex-card ${isDone?'done':''}">
      <div class="rail ${d.split}"></div>
      <div class="ex-main">
        <div class="ex-top">
          <div>
            <span class="ex-tag">${ex.tag} · ${ex.sets} sets × ${ex.reps}</span>
            <div class="ex-name ${isDone?'done-text':''}">${ex.name}</div>
          </div>
          <div class="status-badge ${isDone?'checked':''}">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
        </div>
        <div class="ex-muscles"><b>Targets:</b> ${ex.muscles}</div>
        <div class="ex-inputs">
          <div class="field"><label>Suggested weight</label><div class="weight-label">${ex.weight}<span class="unit">${ex.unit}</span></div></div>
          <div class="field">
            <label>Sets ${setsChecked.filter(Boolean).length}/${ex.sets}</label>

          </div>
        </div>
      </div>
    </div>`;
  }).join('');

    <div class="ex-card" style="padding:16px;">

      </div>

  const aiAddRow = `
    <div class="ai-add-row">

        <input type="text" id="addExInput" placeholder="e.g. cable face pulls for rear delts, 3x15">

    </div>`;

  document.querySelectorAll('[data-set]').forEach(el=>{
    el.onclick = ()=>{ const [exId,idx,tot] = el.dataset.set.split('|'); toggleSet(exId, parseInt(idx,10), parseInt(tot,10)); };
  });

  // week grid
  const weekGrid = document.getElementById('weekGrid');
  plan.days.forEach(dd=>{
    const {pct:wp} = dayProgress(dd.day);
    const cell = document.createElement('div');
    cell.className = 'week-cell' + (dd.day===upNext?' is-today':'');
    cell.innerHTML = `<div class="wd">D${dd.day}</div><div class="wp"><div class="wp-fill" style="width:${wp*100}%; background:var(--${dd.split})"></div></div>`;
    weekGrid.appendChild(cell);
  });

  // bindings
  document.getElementById('accountLink').onclick = ()=>{ APP_STATE='account'; render(); };
  document.getElementById('themeToggleBtn').onclick = toggleTheme;
  document.getElementById('signOutLink').onclick = handleSignOut;
  if(hasPrev) document.getElementById('prevDayBtn').onclick = ()=>{ activeDay = plan.days[dayIdx-1].day; renderDashboard(); };
  if(hasNext) document.getElementById('nextDayBtn').onclick = ()=>{ activeDay = plan.days[dayIdx+1].day; renderDashboard(); };
  const wBtn = document.getElementById('logWeightBtn');
  const wInp = document.getElementById('weightInput');
  wBtn.onclick = ()=>{ logWeight(wInp.value); wInp.value=''; };
  wInp.addEventListener('keydown', e=>{ if(e.key==='Enter') wBtn.click(); });
  document.getElementById('resetBtn').onclick = async ()=>{
    plan.days.forEach(dd=> dd.exercises.forEach(ex=> delete trackerState[ex.id]));
    await saveAll();
    renderDashboard();
  };
  document.getElementById('coachAskBtn').onclick = async ()=>{
    const inp = document.getElementById('coachInput');
    const q = inp.value.trim();
    if(!q) return;
    coachLoading = true; coachAnswer=''; renderDashboard();
    try{ coachAnswer = await callClaude('ask_question', q, null); }
    catch(e){ coachAnswer = 'Sorry — ' + e.message; }
    coachLoading = false; renderDashboard();
  };
  const addExBtnEl = document.getElementById('addExBtn');
  if(addExBtnEl){
    addExBtnEl.onclick = async ()=>{
      const inp = document.getElementById('addExInput');
      const desc = inp.value.trim();
      if(!desc) return;
      addExLoading = true; addExError=''; renderDashboard();
      try{
        const raw = await callClaude('add_workout', desc, {dayTitle:d.title, split:d.split, existing:d.exercises.map(e=>e.name)});
        const parsed = JSON.parse(stripCodeFences(raw));
        const newEx = {
          id: 'ai_' + Date.now(),
          name: String(parsed.name||'Custom Exercise').slice(0,60),
          tag: String(parsed.tag||'Custom').slice(0,30),
          sets: Math.max(1, Math.min(10, parseInt(parsed.sets,10) || 3)),
          reps: String(parsed.reps||'8-12').slice(0,20),
          weight: parsed.weight==null ? '—' : String(parsed.weight).slice(0,10),
          unit: String(parsed.unit||'lbs').slice(0,10),
          muscles: String(parsed.muscles||'').slice(0,200),
        };
        const dayObj = plan.days.find(x=>x.day===activeDay);
        dayObj.exercises.push(newEx);
        await saveAll();
      }catch(e){
        addExError = "Couldn't add that — " + e.message;
      }
      addExLoading = false;
      renderDashboard();
    };
  }
  renderSaveStatus();
}

    </div>

    <div class="account-actions" style="margin-top:20px;">
      <button class="btn-secondary" id="editPlanBtn">Edit Plan</button>
      <button class="btn-danger" id="deleteDataBtn">Delete My Data</button>
    </div>
    <div id="deleteConfirmArea"></div>
  `;

  document.getElementById('backToDash').onclick = ()=>{ APP_STATE='dashboard'; render(); };
  document.getElementById('themeToggleBtn').onclick = toggleTheme;
  document.getElementById('signOutLink').onclick = handleSignOut;
  document.getElementById('editPlanBtn').onclick = startRetake;
  document.getElementById('deleteDataBtn').onclick = ()=>{
    deleteConfirmOpen = true;
    document.getElementById('deleteConfirmArea').innerHTML = `
      <div class="confirm-box">
        This permanently deletes your profile, plan, weight log, and workout history. This does not remove your login credential itself — you'd need to contact support or use the account-deletion function if one is configured. This cannot be undone.
        <div class="row">
          <button id="cancelDelete">Cancel</button>
          <button class="danger" id="reallyDelete">Yes, Delete My Data</button>
        </div>
      </div>`;
    document.getElementById('cancelDelete').onclick = ()=>{ deleteConfirmOpen=false; document.getElementById('deleteConfirmArea').innerHTML=''; };
    document.getElementById('reallyDelete').onclick = confirmDeleteData;
  };
}

function render(){
  if(APP_STATE==='loading') root().innerHTML = `<div class="loading">Loading…</div>`;
  else if(APP_STATE==='signin') renderSignIn();
  else if(APP_STATE==='signup') renderSignUp();
  else if(APP_STATE==='check-email') renderCheckEmail();
  else if(APP_STATE==='questionnaire') renderQuestionnaire();
  else if(APP_STATE==='dashboard') renderDashboard();
  else if(APP_STATE==='account') renderAccount();
}

/* ============================== INIT ============================== */
let confirmToastShown = false;
function maybeShowConfirmToast(){
  if(arrivedViaEmailConfirm && !confirmToastShown){
    confirmToastShown = true;
    showToast('✓ Email confirmed — you\'re in!');
  }
}

function setupSwipeGestures(){
  let touchStartX = null, touchStartY = null;
  document.addEventListener('touchstart', (e)=>{
    const dc = document.getElementById('dayContent');
    if(!dc || !dc.contains(e.target)){ touchStartX = null; return; }
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchend', (e)=>{
    if(touchStartX===null || APP_STATE!=='dashboard' || !plan){ touchStartX = null; return; }
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    touchStartX = null;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)*1.5) return;
    const idx = plan.days.findIndex(dd=>dd.day===activeDay);
    if(dx < 0 && idx < plan.days.length-1){ activeDay = plan.days[idx+1].day; renderDashboard(); }
    else if(dx > 0 && idx > 0){ activeDay = plan.days[idx-1].day; renderDashboard(); }
  }, {passive:true});
}

async function init(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){
    currentUser = session.user;
    await loadProfileAndData();
    maybeShowConfirmToast();
  }
  else { APP_STATE = 'signin'; render(); }

  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_IN' && session && (!currentUser || currentUser.id!==session.user.id)){
      currentUser = session.user;
      loadProfileAndData().then(maybeShowConfirmToast);
    } else if(event==='SIGNED_OUT'){
      currentUser = null; profile = null; plan = null;
      APP_STATE = 'signin'; render();
    }
  });

  setupSwipeGestures();
}
init();
</script>
</body>
</html>
